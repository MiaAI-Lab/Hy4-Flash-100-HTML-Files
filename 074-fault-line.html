<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fault Line — A Seismograph That Answers Back</title>
<style>
:root{--paper:#E8E6DE;--ink:#30353A;--red:#B83A2F}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{padding:24px 28px}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1{font:400 clamp(21px,3vw,34px)/1 Georgia,serif;margin:0}
.meta{font:9px ui-monospace,Menlo,monospace;letter-spacing:.18em}
.sheet{position:relative;margin-top:16px;border:1px solid var(--ink);height:min(72vh,620px);cursor:crosshair;outline:none}
.sheet:focus-visible{outline:3px solid var(--red);outline-offset:3px}
canvas{width:100%;height:100%;display:block}
.label{position:absolute;left:14px;top:12px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em;background:var(--paper);padding:2px 4px}
.legend{position:absolute;right:14px;top:12px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.14em;background:var(--paper);padding:2px 4px;color:var(--red)}
@media(max-width:600px){body{padding:12px}.sheet{height:60vh}.meta{font-size:7px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>Fault Line</h1><span class="meta">SURVEY 074 · OLD BRICK YARD · 1:2500</span></header>
<div class="sheet" id="sheet" tabindex="0" role="button" aria-label="Create an earthquake epicentre"><canvas id="cv"></canvas><div class="label">GRID NORTH 014° · STATION 3</div><div class="legend">CLICK TO DISTURB</div></div>
<script>
const sheet=document.getElementById('sheet'),cv=document.getElementById('cv'),ctx=cv.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let w=0,h=0,quakes=[],marks=[],trace=[],start=performance.now();
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;w=r.width;h=r.height;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0)}
function quake(x,y){quakes.push({x,y,t:performance.now(),mag:.7+Math.random()*.7});marks.push({x,y,t:new Date().toTimeString().slice(0,8)});if(marks.length>8)marks.shift();if(reduce){trace.push(...Array.from({length:50},(_,i)=>Math.exp(-i/12)*Math.sin(i*.8)*18))}}
function displace(x,y,t){let dx=0,dy=0;quakes.forEach(q=>{const age=(t-q.t)/1000,r=age*260,dist=Math.hypot(x-q.x,y-q.y)||1;if(r<=0||Math.abs(dist-r)>90)return;const strength=(1-Math.abs(dist-r)/90)*Math.exp(-age*.32)*q.mag*15;dx+=(x-q.x)/dist*strength;dy+=(y-q.y)/dist*strength});return[dx,dy]}
function frame(t){ctx.clearRect(0,0,w,h);const base=Math.min(1,(t-start)/1200);ctx.lineWidth=.6;ctx.strokeStyle='rgba(48,53,58,.22)';for(let x=20;x<w;x+=32){ctx.beginPath();for(let y=14;y<h-90;y+=8){const[dx,dy]=displace(x,y,t);y===14?ctx.moveTo(x+dx,y+dy):ctx.lineTo(x+dx,y+dy)}ctx.stroke()}for(let y=14;y<h-90;y+=32){ctx.beginPath();for(let x=20;x<w;x+=8){const[dx,dy]=displace(x,y,t);x===20?ctx.moveTo(x+dx,y+dy):ctx.lineTo(x+dx,y+dy)}ctx.stroke()}
 quakes=quakes.filter(q=>(t-q.t)/1000<5);quakes.forEach(q=>{const age=(t-q.t)/1000,r=age*260;if(r<w){ctx.strokeStyle='rgba(184,58,47,'+Math.max(0,.5-age*.1)+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(q.x,q.y,r,0,6.3);ctx.stroke()}});
 marks.forEach(m=>{ctx.strokeStyle='#B83A2F';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(m.x-6,m.y);ctx.lineTo(m.x+6,m.y);ctx.moveTo(m.x,m.y-6);ctx.lineTo(m.x,m.y+6);ctx.stroke();ctx.font='8px ui-monospace,Menlo,monospace';ctx.fillText(m.t,m.x+9,m.y-7)});
 const y0=h-46;ctx.strokeStyle='rgba(48,53,58,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(w,y0);ctx.stroke();let amp=0;quakes.forEach(q=>{const age=(t-q.t)/1000;if(age>.1)amp+=Math.exp(-age*.9)*Math.sin(age*34)*q.mag*22});if(!reduce){trace.unshift(amp+Math.sin(t*.002)*.5);if(trace.length>Math.floor(w/2))trace.pop()}ctx.strokeStyle='#B83A2F';ctx.lineWidth=1.6;ctx.beginPath();trace.forEach((v,i)=>{const x=w-i*2,vy=y0-v; i===0?ctx.moveTo(x,vy):ctx.lineTo(x,vy)});ctx.stroke();ctx.fillStyle='#B83A2F';ctx.beginPath();ctx.arc(0,y0-trace[0],3,0,6.3);ctx.fill();ctx.font='8px ui-monospace,Menlo,monospace';ctx.fillStyle='#30353A';ctx.fillText('STYLUS 3 · VERTICAL MOTION',14,h-12);requestAnimationFrame(frame)}
resize();requestAnimationFrame(frame);addEventListener('resize',resize);
sheet.addEventListener('click',e=>{const r=sheet.getBoundingClientRect();quake(e.clientX-r.left,e.clientY-r.top)});
sheet.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();quake(w/2,h*.4)}});
setTimeout(()=>quake(w*.35,h*.45),900);
</script>
</body>
</html>
