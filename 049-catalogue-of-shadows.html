<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Catalogue of Shadows — Objects Present by Absence</title>
<style>
:root{--grey:#D9D2C2;--ink:#2A2926;--rust:#A33B2C;--lean:0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--grey);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{padding:24px 30px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--ink);padding-bottom:12px}
h1{font:400 clamp(22px,3vw,36px)/1 Georgia,serif;margin:0}
.sub{font:9px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-align:right}
.lamp{position:fixed;right:30px;top:26px;width:28px;height:28px;border:1px solid var(--ink);border-radius:50%;background:var(--grey);z-index:10;transition:left .12s linear,right .12s linear;pointer-events:none;box-shadow:0 0 0 5px rgba(163,59,44,.08)}
.lamp:before{content:'';position:absolute;left:50%;top:-14px;width:1px;height:12px;background:var(--ink)}
.lamp:after{content:'';position:absolute;left:9px;top:9px;width:8px;height:8px;background:var(--rust);border-radius:50%;opacity:0;animation:on .8s .4s forwards}
@keyframes on{to{opacity:1}}
.catalogue{display:grid;grid-template-columns:repeat(3,1fr);gap:38px 28px;margin-top:46px}
.item{border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer;outline:none}
.floor{height:154px;border-bottom:1px solid var(--ink);position:relative;overflow:hidden}
.shape{position:absolute;bottom:0;left:50%;width:120px;height:128px;fill:var(--ink);transform-origin:bottom center;transform:translateX(-50%) skewX(calc(var(--lean)*1deg)) scaleX(1);transition:transform .18s cubic-bezier(.2,.8,.3,1),fill .3s;animation:grow .7s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*.13s)}
@keyframes grow{from{opacity:0;transform:translateX(-50%) scaleY(.05) skewX(calc(var(--lean)*1deg))}to{opacity:1}}
.item:hover .shape,.item:focus-visible .shape{fill:var(--rust)}
.item.active .shape{fill:var(--rust)}
.item:focus-visible .floor{outline:2px solid var(--rust);outline-offset:3px}
.no{font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--rust);margin-top:10px}
.name{font:400 18px/1.2 Georgia,serif;margin-top:6px}
.entry{font:12px/1.5 Georgia,serif;max-width:34ch;min-height:36px;margin-top:6px}
.foot{margin-top:40px;border-top:1px solid var(--ink);padding-top:10px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em}
@media(max-width:820px){.catalogue{grid-template-columns:repeat(2,1fr)}.lamp{display:none}}
@media(max-width:520px){.catalogue{grid-template-columns:1fr}.floor{height:130px}.shape{height:110px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.shape{opacity:1}}
</style>
</head>
<body>
<header><h1>A Catalogue of Shadows</h1><div class="sub">FORM 049 · OBJECTS PRESENT BY ABSENCE<br>ALL ITEMS SOLD WITHOUT THEIR ORIGINALS</div></header><div class="lamp" id="lamp"></div>
<div class="catalogue" id="catalogue"></div>
<div class="foot">THE LAMP IS YOURS TO MOVE. THE OBJECTS ARE NOT.</div>
<script>
const items=[
 ['01','Kettle','Owned by a household that drank tea at four in the afternoon precisely, even on the day the house was emptied.','M16 118 q2-42 26-62 v-12 h30 v12 q24 20 26 62 Z M28 44 l-16-16 M76 44 l16-16 M40 118 h28'],
 ['02','Chair','A dining chair with one short leg. everyone who sat in it leaned slightly to the left without noticing.','M26 118 V46 h52 v72 M26 74 h52 M32 118 v22 M72 118 v22 M26 46 l-8-14 M78 46 l8-14'],
 ['03','Key','It opened a door that was bricked up in 1963. The key was kept anyway, in a drawer of useful things.','M30 74 a22 22 0 1 1 30 20 v46 h14 v14 h-16 v-14 h-8 v-16 a22 22 0 1 1-20-50 Z M52 74 h18'],
 ['04','Bicycle','Owned by someone who left in a hurry. The front wheel was removed so it could fit under a bed.','M18 100 a28 28 0 1 1 56 0 a28 28 0 1 1-56 0 M74 100 a26 26 0 1 1 52 0 a26 26 0 1 1-52 0 M46 100 l30-44 h22 M64 56 h22 M32 56 h28'],
 ['05','Feather','Found on a windowsill in February. No bird in the district was missing it.','M60 120 Q20 90 32 28 Q88 40 82 96 Q78 112 60 120 Z M60 120 L36 14 M44 70 L30 52 M52 90 L38 76 M64 62 L76 46'],
 ['06','Ladder','Left against the wall of a house where nobody now climbs. The top rung is worn smooth on one side.','M28 126 L44 8 M84 126 L68 8 M33 104 h46 M37 82 h42 M41 60 h38 M45 38 h34 M49 18 h26']
];
const cat=document.getElementById('catalogue'),lamp=document.getElementById('lamp'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
items.forEach((it,i)=>{const b=document.createElement('button');b.type='button';b.className='item';b.style.setProperty('--i',i);b.innerHTML=`<div class="floor"><svg class="shape" viewBox="0 0 140 150" style="--i:${i}" aria-hidden="true"><path d="${it[3]}"/></svg></div><div class="no">OBJECT ${it[0]} / SHADOW ONLY</div><div class="name">${it[1]}</div><div class="entry">Not yet catalogued.</div>`;b.addEventListener('click',()=>{document.querySelectorAll('.item').forEach(x=>{x.classList.remove('active');x.querySelector('.entry').textContent='Not yet catalogued.'});b.classList.add('active');b.querySelector('.entry').textContent=it[2]});cat.appendChild(b)});
function moveLamp(x){if(reduce)return;const w=innerWidth,ratio=Math.max(0,Math.min(1,x/w)),px=26+ratio*(w-70);lamp.style.left=px+'px';lamp.style.right='auto';document.documentElement.style.setProperty('--lean',((ratio-.5)*38).toFixed(2))}
addEventListener('pointermove',e=>moveLamp(e.clientX));addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const cur=parseFloat(lamp.style.left)||innerWidth-58;moveLamp(cur+(e.key==='ArrowRight'?60:-60));e.preventDefault()}});
moveLamp(innerWidth*.78);
</script>
</body>
</html>
