<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moth &amp; Miso — A Neon Noodle Shop After Midnight</title>
<style>
:root{--ink:#110E0D;--red:#D82D2D;--yellow:#F2C13C}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:#F5E7C8;font-family:Arial,Helvetica,sans-serif}
body{padding:22px 26px 0;overflow-x:hidden}
.wrap{max-width:1000px;margin:auto}
.sign{height:190px;position:relative;display:grid;place-items:center}
.sign svg{width:100%;height:100%;overflow:visible}
.tube{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow);animation:flick 5s steps(1) both}
.tube.amber{stroke:var(--yellow);animation-delay:.35s}
@keyframes flick{0%,8%,11%,14%,100%{opacity:1}9%,13%{opacity:.16}12%{opacity:.5}}
.hours{font:9px ui-monospace,Menlo,monospace;letter-spacing:.32em;color:var(--yellow);text-align:center;margin-top:-18px}
.steam{height:150px;position:relative;max-width:700px;margin:0 auto}
.steam span{position:absolute;font:400 30px/1 Georgia,serif;color:var(--yellow);text-shadow:0 0 12px rgba(242,193,60,.75),0 0 28px rgba(216,45,45,.35);pointer-events:none;white-space:pre}
.order{text-align:center;min-height:42px;border-top:1px solid rgba(242,193,60,.25);padding-top:8px;font:11px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:#CBB68D}
.order i{color:var(--red);font-style:normal}
.counter{position:relative;margin-top:16px;height:250px;border-top:18px solid #251B17;border-bottom:11px solid #080606;background:linear-gradient(#1A1310,#0B0908);display:flex;align-items:flex-end;justify-content:space-around;padding:0 12px 14px}
.bowl{background:none;border:0;padding:0;cursor:pointer;width:180px;color:inherit;position:relative;outline:none}
.bowl svg{width:100%;display:block;transition:transform .5s cubic-bezier(.2,1.3,.3,1),filter .3s}
.bowl:hover svg,.bowl:focus-visible svg{transform:translateY(-8px);filter:drop-shadow(0 0 12px rgba(216,45,45,.55))}
.bowl:focus-visible{outline:2px dashed var(--yellow);outline-offset:5px}
.bowl small{display:block;font:9px ui-monospace,Menlo,monospace;letter-spacing:.18em;color:#9C8868;margin-top:5px}
.footer{text-align:center;font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#6F6254;padding:18px 0 14px}
@media(max-width:700px){.sign{height:135px}.bowl{width:44%}.counter{height:320px;flex-wrap:wrap;align-content:flex-end;gap:12px}.steam{height:110px}.steam span{font-size:23px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <div class="sign"><svg viewBox="0 0 900 190" aria-label="Moth and Miso">
  <defs><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <path class="tube" d="M72 118 Q75 57 118 56 Q151 55 150 91 Q149 128 116 125 Q142 131 160 118 M205 124 Q195 92 218 77 Q243 61 263 84 Q275 101 267 124 M267 70 L267 130 M319 124 Q317 72 355 72 Q383 72 380 102 Q377 127 349 124 Q369 118 372 96 M425 124 L425 72 L463 114 L463 72"/>
  <path class="tube amber" d="M520 123 Q508 82 544 71 Q574 62 584 88 Q591 108 579 124 M642 123 Q632 81 668 72 Q698 66 705 90 Q711 109 699 124 M754 70 L754 130 M754 70 Q791 64 798 96 Q804 127 770 124"/>
  <path class="tube" d="M45 150 Q450 176 855 150" opacity=".55"/>
 </svg></div>
 <div class="hours">OPEN UNTIL THE LAST TRAIN · NO. 14 ALLEY BEHIND THE STATION</div>
 <div class="steam" id="steam" aria-live="polite"></div>
 <div class="order" id="order">CHOOSE A BOWL — <i>the steam will tell you its name</i></div>
 <div class="counter" id="counter"></div>
 <div class="footer">MOTH &amp; MISO · BROTH FROM 06:00 · SILENCE FROM 01:00</div>
</div>
<script>
const dishes=[
 {name:'TOKYO DRIZZLE',desc:'shoyu broth · chicken · charred scallion',top:'#C99A5A',broth:'#7C4A24'},
 {name:'RED HOUR',desc:'spicy miso · sweetcorn · chilli oil',top:'#D82D2D',broth:'#A63A24'},
 {name:'MIDNIGHT MISO',desc:'white miso · egg · bamboo shoot',top:'#F2C13C',broth:'#B28A4A'},
 {name:'SALT & STATIC',desc:'clear broth · nori · squid',top:'#9FBCC4',broth:'#6E8B8E'}
];
const counter=document.getElementById('counter'),steam=document.getElementById('steam'),order=document.getElementById('order'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
dishes.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.className='bowl';b.setAttribute('aria-label','Order '+d.name+', '+d.desc);b.innerHTML='<svg viewBox="0 0 180 100"><ellipse cx="90" cy="52" rx="65" ry="18" fill="'+d.broth+'"/><path d="M24 52 Q30 96 90 98 Q150 96 156 52 Z" fill="#201614" stroke="#5C4032" stroke-width="2"/><path d="M36 58 Q52 42 70 58 T104 58 T140 58" fill="none" stroke="#E8D7A6" stroke-width="2.4"/><circle cx="60" cy="49" r="10" fill="#F1DDAE"/><circle cx="60" cy="49" r="4" fill="'+d.top+'"/><path d="M100 40 l18 4 -18 4 18 4" stroke="#2A3D36" stroke-width="4" fill="none"/><ellipse cx="90" cy="52" rx="65" ry="18" fill="none" stroke="#D8B984" stroke-width="2"/></svg><small>'+d.name+'</small>';b.addEventListener('click',()=>orderDish(d,b));counter.appendChild(b)});
function orderDish(d,btn){
 steam.textContent='';order.innerHTML='ORDER UP — <i>'+d.desc.toUpperCase()+'</i>';
 const chars=[...d.name],spacing=Math.min(24,620/chars.length),startX=btn.getBoundingClientRect().left+btn.getBoundingClientRect().width/2-steam.getBoundingClientRect().left,targetX0=steam.getBoundingClientRect().width/2-(chars.length-1)*spacing/2;
 chars.forEach((c,i)=>{const s=document.createElement('span');s.textContent=c===' '?'\u00a0':c;const tx=targetX0+i*spacing,ty=32; s.style.left=tx+'px';s.style.top=ty+'px';steam.appendChild(s);if(reduce)return;const sx=startX+(Math.random()-.5)*16,sy=steam.clientHeight-6;s.animate([{transform:'translate('+(sx-tx)+'px,'+(sy-ty)+'px) scale(.55) rotate(-18deg)',opacity:0},{offset:.45,transform:'translate('+((sx-tx)*.45+Math.sin(i)*22)+'px,-30px) scale(1.08) rotate(9deg)',opacity:1},{transform:'translate(0,0) scale(1) rotate(0deg)',opacity:1}],{duration:1150+i*35,delay:i*45,easing:'cubic-bezier(.16,.9,.25,1)',fill:'both'})});
}
orderDish(dishes[0],counter.firstElementChild);
</script>
</body>
</html>
