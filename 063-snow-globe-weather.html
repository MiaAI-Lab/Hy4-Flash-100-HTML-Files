<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow Globe Weather — A Storm That Agrees to Settle</title>
<style>
:root{--sky:#C6DFEA;--snow:#F7F8F4;--red:#B8433B}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--sky);color:#294556;font-family:Arial,Helvetica,sans-serif}
body{padding:26px;display:flex;flex-direction:column;align-items:center}
h1{font:400 clamp(24px,4vw,42px)/1 Georgia,serif;margin:0;letter-spacing:-.02em}
.sub{font:9px ui-monospace,Menlo,monospace;letter-spacing:.22em;margin:10px 0 22px}
.globe{width:min(78vw,500px);aspect-ratio:1;border-radius:50%;border:12px solid var(--snow);background:#D9E8EE;box-shadow:0 22px 45px rgba(41,69,86,.22),inset 0 0 0 2px rgba(41,69,86,.12);position:relative;overflow:hidden;touch-action:none;cursor:grab}
.globe:active{cursor:grabbing}
canvas{position:absolute;inset:0;width:100%;height:100%}
.village{position:absolute;inset:0;width:100%;height:100%;opacity:.08;transition:opacity 1.2s ease}
.globe.clear .village{opacity:1}
.report{margin-top:20px;display:flex;gap:18px;align-items:center;font:10px ui-monospace,Menlo,monospace;letter-spacing:.2em}
.report b{color:var(--red);min-width:100px}
.shake{margin-top:18px;background:var(--red);color:var(--snow);border:0;padding:13px 24px;font:10px ui-monospace,Menlo,monospace;letter-spacing:.24em;cursor:pointer;border-radius:0 0 4px 4px;box-shadow:0 5px 0 #8E302B;transition:transform .25s,box-shadow .25s}
.shake:active{transform:translateY(5px);box-shadow:none}
.shake:focus-visible{outline:3px solid #294556;outline-offset:4px}
.note{margin-top:16px;font:italic 13px Georgia,serif;color:#557487;text-align:center;max-width:420px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>Storm in a Glass</h1><div class="sub">STATION 063 · OBSERVATIONS FROM ONE SMALL WINTER</div>
<div class="globe" id="globe"><svg class="village" viewBox="0 0 500 500"><path d="M0 350 Q110 315 230 348 T500 336 V500 H0Z" fill="#E9F1F3"/><path d="M0 382 Q130 354 260 380 T500 370 V500 H0Z" fill="#F7F8F4"/><g fill="#B8433B"><path d="M116 314 l44 -35 44 35Z"/><path d="M302 330 l38 -30 38 30Z"/><path d="M214 345 l30 -24 30 24Z"/></g><g fill="#F7F8F4" stroke="#7D9BA8"><rect x="128" y="314" width="64" height="44"/><rect x="313" y="330" width="54" height="38"/><rect x="222" y="345" width="44" height="32"/></g><g fill="#F2C13C"><rect x="140" y="326" width="12" height="12"/><rect x="172" y="326" width="12" height="12"/><rect x="326" y="341" width="10" height="10"/></g><g stroke="#7D9BA8" stroke-width="3"><path d="M80 355 v-42 M68 326 l12 -22 12 22 M398 360 v-52 M386 322 l12 -24 12 24"/></g></svg><canvas id="snow"></canvas></div>
<div class="report"><span>REPORT</span><b id="state">WHITEOUT</b><span id="clock">+00:00</span></div>
<button class="shake" id="shake" type="button">SHAKE THE WEATHER</button>
<div class="note">Some weather is small enough to keep on a shelf. This one still needs shaking.</div>
<script>
const globe=document.getElementById('globe'),cv=document.getElementById('snow'),ctx=cv.getContext('2d'),state=document.getElementById('state'),clock=document.getElementById('clock'),shake=document.getElementById('shake'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let w=0,h=0,flakes=[],storm=1,end=0,dragging=false,lastX=0;
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;w=r.width;h=r.height;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0);flakes=Array.from({length:220},(_,i)=>({x:Math.random()*w,y:Math.random()*h,r:.6+Math.random()*2.3,vx:0,vy:0,phase:Math.random()*6.3,settled:false}))}
function start(){storm=reduce?0:1;end=performance.now()+(reduce?0:4200);globe.classList.remove('clear');flakes.forEach(f=>{f.settled=false;f.x=Math.random()*w;f.y=Math.random()*h*.9});state.textContent=reduce?'CLEAR':'WHITEOUT';clock.textContent='+00:00'}
function frame(t){const dt=Math.min(32,t-(frame.last||t))/16.7;frame.last=t;if(storm>0){const p=Math.max(0,(end-t)/4200);storm=p*p;if(p<=0){storm=0;globe.classList.add('clear')}state.textContent=p>.62?'WHITEOUT':p>.2?'LIGHT FALL':'CLEAR';clock.textContent='+'+String(Math.floor((4200*(1-p))/1000)).padStart(2,'0')+':00'}ctx.clearRect(0,0,w,h);ctx.fillStyle='#F7F8F4';flakes.forEach(f=>{if(!f.settled){const swirl=storm*2.4;f.vx+=(Math.sin(f.y*.03+t*.002+f.phase)*.06+swirl*(f.y/h-.5)*.12-f.vx*.04)*dt;f.vy+=(.035+storm*.05-f.vy*.05)*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.x<-8)f.x=w+8;if(f.x>w+8)f.x=-8;const ground=h*.78+Math.sin(f.x*.02)*9;if(f.y>ground&&storm<.35){f.y=ground;f.settled=true}}ctx.globalAlpha=f.settled?.9:.35+(1-storm)*.5;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.3);ctx.fill()});ctx.globalAlpha=1;requestAnimationFrame(frame)}
resize();start();requestAnimationFrame(frame);addEventListener('resize',()=>{resize();if(storm===0)flakes.forEach(f=>{f.settled=true;f.y=h*.78+Math.sin(f.x*.02)*9})});
shake.addEventListener('click',start);
globe.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;globe.setPointerCapture(e.pointerId);start()});
globe.addEventListener('pointermove',e=>{if(!dragging)return;flakes.forEach(f=>f.vx+=(e.clientX-lastX)*.35);lastX=e.clientX});
globe.addEventListener('pointerup',()=>dragging=false);
</script>
</body>
</html>
