<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Cartography of Sounds — Districts Heard, Not Seen</title>
<style>
:root{--mint:#BFDCC8;--ink:#1D3A33;--orange:#E07A3F;--paper:#F3EEE1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--mint);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#map{position:absolute;inset:0 0 130px;width:100%;height:calc(100% - 130px)}
canvas{position:absolute;inset:0 0 130px;width:100%;height:calc(100% - 130px);pointer-events:none;z-index:3}
h1{position:absolute;left:26px;top:22px;font:10px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.24em;margin:0;z-index:4}
.legend{position:absolute;right:26px;top:22px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;z-index:4}
.district polygon{fill:var(--mint);stroke:var(--ink);stroke-width:2;cursor:pointer;outline:none;transition:fill .4s}
.district:hover polygon,.district:focus-visible polygon,.district.active polygon{fill:#D6E8D8}
.district:focus-visible polygon{stroke-width:5}
.district text{font:9px ui-monospace,Menlo,monospace;letter-spacing:.14em;fill:var(--ink);pointer-events:none;opacity:0;animation:labelIn .6s ease-out 1.1s forwards}
@keyframes labelIn{to{opacity:.8}}
.street{fill:none;stroke:var(--paper);stroke-width:6;stroke-dasharray:900;stroke-dashoffset:900;animation:draw .8s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
footer{position:absolute;left:0;right:0;bottom:0;height:130px;background:var(--paper);border-top:2px solid var(--ink);display:grid;grid-template-columns:minmax(240px,30vw) 1fr auto;gap:22px;padding:20px 26px;align-items:center;z-index:5}
footer .tag{font:9px/1.7 ui-monospace,Menlo,monospace;letter-spacing:.16em}
footer h2{font:400 clamp(19px,2vw,27px)/1.1 Georgia,serif;margin:0 0 6px}
footer p{font:13px/1.5 Georgia,serif;margin:0;max-width:72ch;opacity:.8}
button{background:transparent;color:var(--ink);border:1px solid var(--ink);padding:10px 14px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper)}
@media(max-width:700px){footer{grid-template-columns:1fr auto;height:auto;min-height:130px;padding:14px}footer .tag{display:none}#map,canvas{height:calc(100% - 150px)}h1{font-size:8px}.legend{font-size:7px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.district text{opacity:.8}.street{stroke-dashoffset:0}}
</style>
</head>
<body>
<h1>A CARTOGRAPHY OF SOUNDS</h1><div class="legend">LISTEN WITH THE POINTER / 32</div>
<svg id="map" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice" aria-label="Map of five sound districts"></svg>
<canvas id="waves"></canvas>
<footer><div class="tag">FIVE DISTRICTS<br>ONE NIGHT<br>NO STREET NAMES</div><div><h2 id="title">Choose a district to listen</h2><p id="desc">The map is drawn from reports of things heard through walls. Nothing here is visible from the street.</p></div><button id="mute" type="button" aria-pressed="false">SOUND ON</button></footer>
<script>
const NS='http://www.w3.org/2000/svg',map=document.getElementById('map'),canvas=document.getElementById('waves'),ctx=canvas.getContext('2d'),title=document.getElementById('title'),desc=document.getElementById('desc'),mute=document.getElementById('mute');
const districts=[
 {n:'THE PUMP HOUSE HUMS AT 62 HZ',p:'100,80 420,50 470,230 300,310 90,250',f:[62,124,186],d:'A low motor keeps the water moving through a building nobody admits to owning. The note is felt in the teeth before it is heard.'},
 {n:'A WINDOW LEFT OPEN',p:'470,50 900,70 930,250 660,280 470,230',f:[330,495,660],d:'Curtains move in a room where nobody is sitting. The sound is mostly the street deciding to come inside.'},
 {n:'THE BAKERY BEFORE DOUGH',p:'90,250 300,310 350,520 80,560',f:[110,220,330],d:'At 03:40 the oven is warm and the room is empty. The first scrape of a tray is the day clearing its throat.'},
 {n:'TWO ARGUMENTS IN ONE ROOM',p:'300,310 470,230 660,280 700,500 350,520',f:[196,262,392],d:'Both voices believe they are being reasonable. The walls have stopped taking sides and simply hold the frequencies.'},
 {n:'THE LAST TRAM',p:'660,280 930,250 960,560 700,500',f:[440,880,1320],d:'A wire complains above the junction. The tram arrives late and leaves early, as if embarrassed to be seen.'}
];
const streets=['M430 55 Q450 150 460 230','M85 255 Q230 285 305 310','M665 280 Q680 390 695 500','M470 235 Q560 250 660 285'];
streets.forEach((d,i)=>{const p=document.createElementNS(NS,'path');p.setAttribute('class','street');p.setAttribute('d',d);p.style.animationDelay=(i*.16)+'s';map.appendChild(p)});
const groups=[];
districts.forEach((o,i)=>{const g=document.createElementNS(NS,'g');g.setAttribute('class','district');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',o.n);const p=document.createElementNS(NS,'polygon');p.setAttribute('points',o.p);g.appendChild(p);const t=document.createElementNS(NS,'text');const xy=o.p.split(' ').map(q=>q.split(',').map(Number));t.setAttribute('x',xy.reduce((s,q)=>s+q[0],0)/xy.length);t.setAttribute('y',xy.reduce((s,q)=>s+q[1],0)/xy.length);t.setAttribute('text-anchor','middle');t.textContent=o.n;g.appendChild(t);g.addEventListener('click',e=>listen(i,e));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const r=g.getBoundingClientRect();listen(i,{clientX:r.left+r.width/2,clientY:r.top+r.height/2})}});map.appendChild(g);groups.push(g)});
let ac=null,muted=false,rings=[],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}
function sound(freqs){if(muted)return;ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=i%2?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07/(i+1),t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+1.7)})}
function listen(i,e){const o=districts[i];title.textContent=o.n;desc.textContent=o.d;groups.forEach((g,k)=>g.classList.toggle('active',k===i));sound(o.f);const r=canvas.getBoundingClientRect();const x=(e.clientX||0)-r.left,y=(e.clientY||0)-r.top;if(reduce){rings=[{x,y,r:20,max:60,spacing:30,life:1}];draw();return}const spacing=Math.max(14,Math.min(52,1100/o.f[0]));rings.push({x,y,r:4,max:Math.max(r.width,r.height)*.75,spacing,life:1});requestAnimationFrame(anim)}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);rings.forEach(g=>{ctx.beginPath();ctx.strokeStyle=`rgba(224,122,63,${Math.max(0,g.life*.55)})`;ctx.lineWidth=1.5;ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.stroke()})}
let running=false;
function anim(){let alive=false;rings.forEach(g=>{g.r+=2.2;g.life=Math.max(0,1-g.r/g.max);if(g.life>0)alive=true});draw();if(alive)requestAnimationFrame(anim);else{rings=[];running=false}}
mute.addEventListener('click',()=>{muted=!muted;mute.textContent=muted?'SOUND OFF':'SOUND ON';mute.setAttribute('aria-pressed',muted)});
window.addEventListener('resize',resize);resize();
</script>
</body>
</html>
