<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackout Bingo — The Last Number Turns Out the Lights</title>
<style>
:root{--black:#111110;--cream:#E8DFC9;--red:#A9322B;--bulb:#F3C06B}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1A1917;color:var(--cream);font-family:Arial,Helvetica,sans-serif;transition:background .5s;overflow:hidden}
body.dark1{background:#0E0E0D}body.dark2{background:#090908}body.blackout{background:var(--black)}
h1{position:absolute;left:26px;top:20px;font:10px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.22em;margin:0}
.ticker{position:absolute;right:26px;top:20px;font:11px ui-monospace,Menlo,monospace;letter-spacing:.18em;color:var(--bulb)}
.room{position:relative;min-height:100vh;display:grid;place-items:center}
.card{display:grid;grid-template-columns:repeat(5,1fr);width:min(88vw,520px);border:2px solid var(--cream);background:#1A1917;transition:background .5s,opacity .5s;position:relative;z-index:2}
.blackout .card{background:#0B0B0A}
.cell{position:relative;aspect-ratio:1;border-right:1px solid rgba(232,223,201,.3);border-bottom:1px solid rgba(232,223,201,.3);background:transparent;color:var(--cream);cursor:pointer;outline:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:flip .5s cubic-bezier(.2,1.1,.3,1) both;animation-delay:calc(var(--i)*.045s);transform-origin:center top}
.cell:nth-child(5n){border-right:0}.cell:nth-child(n+21){border-bottom:0}
@keyframes flip{from{opacity:0;transform:rotateX(90deg)}to{opacity:1;transform:none}}
.cell .num{font:20px Georgia,serif}.cell .word{font:7px ui-monospace,Menlo,monospace;letter-spacing:.14em;opacity:.65}
.cell:hover{background:rgba(232,223,201,.07)}
.cell:focus-visible{outline:2px solid var(--bulb);outline-offset:-4px}
.cell.marked:before{content:'✕';position:absolute;font:52px Georgia,serif;color:var(--red);opacity:.9}
.cell.called:after{content:'';position:absolute;right:5px;top:5px;width:6px;height:6px;background:var(--bulb);border-radius:50%}
.cell.marked .num{opacity:.35}
.bulb{position:absolute;left:50%;top:6%;transform:translateX(-50%);z-index:3;opacity:0;transition:opacity .6s .2s;text-align:center;pointer-events:none}
.bulb .glass{width:26px;height:36px;border:2px solid var(--bulb);border-radius:50% 50% 40% 40%;margin:auto;background:var(--bulb);box-shadow:0 0 24px var(--bulb)}
.bulb .cord{width:1px;height:12vh;background:var(--bulb);margin:auto;transform:translateY(-12vh)}
.bulb .cone{width:min(70vw,560px);height:74vh;background:rgba(243,192,107,.09);clip-path:polygon(48% 0,52% 0,100% 100%,0 100%);margin:-2px auto 0}
.blackout .bulb{opacity:1}
.message{position:absolute;left:50%;top:24%;transform:translateX(-50%);font:11px ui-monospace,Menlo,monospace;letter-spacing:.3em;color:var(--bulb);opacity:0;transition:opacity .5s .7s;pointer-events:none;z-index:5;white-space:nowrap}
.blackout .message{opacity:1}
.reset{position:absolute;left:26px;bottom:22px;background:transparent;border:1px solid var(--cream);color:var(--cream);padding:9px 12px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em;cursor:pointer;z-index:6}
.reset:hover{border-color:var(--bulb);color:var(--bulb)}
@media(max-width:600px){h1,.ticker{font-size:7px}.cell .num{font-size:15px}.cell .word{font-size:5px}.message{font-size:7px}.reset{left:12px;bottom:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1>BLACKOUT BINGO / 52<br>LISTENING ROOM · WATCH THE CALLER</h1><div class="ticker" id="ticker">CALLER / READY</div>
<div class="room"><div class="card" id="card" role="grid" aria-label="Bingo card"></div></div>
<div class="bulb"><div class="cord"></div><div class="glass"></div><div class="cone"></div></div><div class="message">BLACKOUT — ONE LINE</div>
<button class="reset" id="reset" type="button">RESET CARD</button>
<script>
const words=['LAMP','CURFEW','LETTER','BREAD','SIREN','COAL','TRAIN','KEY','WINDOW','CLOCK','PAPER','SHOE','MILK','RADIO','STATION','GLOVE','BOLT','TICKET','STREET','MATCH','SHILLING','BOOT','FENCE','SPOON','DOOR'];
const nums=[12,27,44,8,61,35,19,72,5,48,23,66,31,54,9,40,77,16,58,3,69,21,46,83,14];
const card=document.getElementById('card'),ticker=document.getElementById('ticker'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let called=[],win=false,timer=null;
nums.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.className='cell';b.style.setProperty('--i',i);b.setAttribute('role','gridcell');b.setAttribute('aria-label',n+' '+words[i]);b.innerHTML=`<span class="num">${n}</span><span class="word">${words[i]}</span>`;b.addEventListener('click',()=>mark(b));card.appendChild(b)});
function mark(b){if(win||b.dataset.marked)return;b.dataset.marked='1';b.classList.add('marked');check()}
function call(n){called.push(n);const b=[...card.children].find(c=>c.querySelector('.num').textContent===String(n));if(b)b.classList.add('called');ticker.textContent='CALLER / '+String(n).padStart(2,'0')+' — '+words[nums.indexOf(n)]}
function check(){const g=[...card.children],m=i=>g[i].dataset.marked;const lines=[];for(let r=0;r<5;r++)lines.push([0,1,2,3,4].map(c=>m(r*5+c)));for(let c=0;c<5;c++)lines.push([0,1,2,3,4].map(r=>m(r*5+c)));lines.push([0,6,12,18,24].map(m),[4,8,12,16,20].map(m));if(lines.some(l=>l.every(Boolean)))blackout()}
function blackout(){win=true;if(timer)clearInterval(timer);if(reduce){document.body.classList.add('blackout');return}document.body.classList.add('dark1');setTimeout(()=>document.body.classList.add('dark2'),260);setTimeout(()=>document.body.classList.add('blackout'),540)}
function reset(){win=false;called=[];document.body.className='';ticker.textContent='CALLER / READY';[...card.children].forEach(c=>{c.classList.remove('marked','called');delete c.dataset.marked});if(timer)clearInterval(timer);timer=setInterval(()=>{if(win)return;const pool=nums.filter(n=>!called.includes(n));if(pool.length)call(pool[Math.floor(Math.random()*pool.length)]);else clearInterval(timer)},1800)}
document.getElementById('reset').addEventListener('click',reset);
card.addEventListener('keydown',e=>{const cells=[...card.children],i=cells.indexOf(document.activeElement);let n=i;if(e.key==='ArrowRight')n=(i+1)%25;else if(e.key==='ArrowLeft')n=(i+24)%25;else if(e.key==='ArrowDown')n=(i+5)%25;else if(e.key==='ArrowUp')n=(i+20)%25;else if(e.key===' '){mark(document.activeElement);e.preventDefault();return}if(n!==i){cells[n].focus();e.preventDefault()}});
reset();
</script>
</body>
</html>
