<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lady Who Kept the Rain — Lost Film, Reel One</title>
<style>
:root{--black:#090909;--white:#F2F0E8;--gray:#888680}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;cursor:pointer}
body{padding:28px;display:grid;place-items:center;overflow:hidden}
.screen{position:relative;width:min(92vw,1000px);aspect-ratio:4/3;border:1px solid var(--gray);background:#0B0B0B;box-shadow:0 0 0 12px #050505,0 0 90px rgba(242,240,232,.06)}
.screen:before,.screen:after{content:'';position:absolute;left:-8px;right:-8px;height:6px;background:repeating-linear-gradient(90deg,var(--gray) 0 9px,transparent 9px 18px);opacity:.45}
.screen:before{top:16px}.screen:after{bottom:16px}
.card{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:8%;opacity:0;pointer-events:none}
.card.active{opacity:1;animation:strike .85s steps(6) both}
@keyframes strike{0%{opacity:0;transform:translate(3px,-2px)}18%{opacity:1;transform:translate(-2px,2px)}36%{opacity:.45;transform:translate(2px,0)}54%{opacity:1;transform:translate(0,1px)}100%{opacity:1;transform:none}}
.card .title{font:400 clamp(30px,6vw,72px)/1.05 Georgia,serif;letter-spacing:.01em;text-shadow:2px 1px 0 var(--gray),-1px -1px 0 rgba(242,240,232,.35)}
.card .credit{font:10px ui-monospace,Menlo,monospace;letter-spacing:.36em;color:var(--gray)}
.card .chapter{font:400 clamp(22px,4vw,46px)/1.2 Georgia,serif;letter-spacing:.06em}
.card .line{font:italic 400 clamp(20px,3.4vw,40px)/1.3 Georgia,serif;max-width:760px}
.card .end{font:400 clamp(26px,5vw,58px)/1 Georgia,serif;letter-spacing:.2em}
.meta{position:absolute;left:26px;top:26px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.24em;color:var(--gray)}
.num{position:absolute;right:26px;top:26px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--gray)}
.cue{position:absolute;right:26px;bottom:26px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.24em;color:var(--white);animation:cue 1.4s steps(2) infinite}
@keyframes cue{50%{opacity:.25}}
.grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.2;mix-blend-mode:screen;animation:grainMove .5s steps(3) infinite}
@keyframes grainMove{0%{transform:translate(0,0)}33%{transform:translate(-2%,1%)}66%{transform:translate(1%,-2%)}}
.flash{position:absolute;inset:0;background:var(--white);opacity:0;pointer-events:none;animation:flash 5.2s steps(1) infinite}
@keyframes flash{0%,4%,6%,100%{opacity:0}5%{opacity:.22}5.5%{opacity:.04}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.cue{opacity:1}}
</style>
</head>
<body>
<div class="screen" id="screen" role="button" tabindex="0" aria-label="Advance film intertitle"><div class="meta">VALE FILMS · 1926 · NITRATE PRINT</div><div class="num" id="num">TITLE 01 / 05</div><div id="cards"></div><div class="cue" id="cue">CONTINUE →</div><svg class="grain" aria-hidden="true"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#noise)"/></svg><div class="flash"></div></div>
<script>
const cardsData=[
 {k:'credit',html:'<div class="credit">A FILM BY AUGUST VALE<br>PHOTOGRAPHY BY E. MARCH · 1926</div>'},
 {k:'title',html:'<div class="title">THE LADY WHO<br>KEPT THE RAIN</div>'},
 {k:'chapter',html:'<div class="chapter">CHAPTER ONE<br>IN WHICH A CLOCK IS RETURNED</div>'},
 {k:'line',html:'<div class="line">The city had not stopped.<br>Only the umbrellas had.</div>'},
 {k:'end',html:'<div class="end">END OF REEL ONE</div>'}
];
const holder=document.getElementById('cards'),screen=document.getElementById('screen'),num=document.getElementById('num'),cue=document.getElementById('cue');
cardsData.forEach((c,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=c.html;holder.appendChild(d)});
const els=[...holder.children];let idx=0;
function show(i){els.forEach((e,j)=>e.classList.toggle('active',j===i));num.textContent='TITLE '+String(i+1).padStart(2,'0')+' / 05';cue.textContent=i===els.length-1?'RESTART ↺':'CONTINUE →'}
function advance(){idx=(idx+1)%els.length;show(idx)}
show(0);screen.addEventListener('click',advance);screen.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();advance()}});
</script>
</body>
</html>
