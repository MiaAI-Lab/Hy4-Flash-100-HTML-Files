<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museum of Almost — Things That Nearly Happened</title>
<style>
:root{--paper:#F4EFE6;--ink:#1D1B19;--red:#D3482B}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{padding:30px 34px 50px;background-image:radial-gradient(rgba(29,27,25,.045) 1px,transparent 1px);background-size:12px 12px}
header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--ink);padding-bottom:14px;opacity:0;animation:fade .8s 1.1s forwards}
@keyframes fade{to{opacity:1}}
h1{font:400 clamp(22px,3vw,38px)/1 Georgia,serif;margin:0;letter-spacing:-.02em}
.sub{font:9px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-align:right}
.dot{display:inline-block;width:8px;height:8px;background:var(--red);border-radius:50%;vertical-align:middle;margin-right:7px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:46px}
.case{background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer;outline:none}
.vitrine{position:relative;height:min(34vw,290px);border:1px solid var(--ink);background:rgba(255,255,255,.24);box-shadow:10px 12px 0 -4px rgba(29,27,25,.07)}
.vitrine:after{content:'';position:absolute;left:9%;right:9%;bottom:-12px;height:7px;background:rgba(29,27,25,.06);filter:blur(2px)}
.vitrine svg{position:absolute;inset:10%;width:80%;height:80%;overflow:visible}
.outline{position:absolute;inset:0;pointer-events:none}
.outline path{stroke:var(--ink);fill:none;stroke-width:1.2;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.3s cubic-bezier(.65,0,.35,1) forwards;animation-delay:calc(var(--i)*.35s)}
@keyframes draw{to{stroke-dashoffset:0}}
.art path,.art line,.art circle,.art rect{stroke:var(--red);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len,400);stroke-dashoffset:var(--len,400);transition:stroke-dashoffset 1.5s cubic-bezier(.65,0,.25,1)}
.case.open .art path,.case.open .art line,.case.open .art circle,.case.open .art rect{stroke-dashoffset:0;transition-delay:calc(var(--p)*.16s)}
.meta{margin-top:20px;border-top:1px solid var(--ink);padding-top:10px}
.no{font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--red)}
.title{font:400 18px/1.2 Georgia,serif;margin:8px 0}
.story{font:13px/1.6 Georgia,serif;min-height:76px;max-width:34ch}
.case:hover .vitrine{box-shadow:10px 12px 0 -4px rgba(211,72,43,.18)}
.case:focus-visible .vitrine{outline:2px solid var(--red);outline-offset:4px}
footer{margin-top:36px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ink);padding-top:12px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em}
footer button{background:transparent;border:1px solid var(--ink);padding:8px 12px;color:var(--ink);font:inherit;cursor:pointer}
footer button:hover{background:var(--red);border-color:var(--red);color:var(--paper)}
@media(max-width:800px){.gallery{grid-template-columns:1fr;gap:30px}.vitrine{height:230px}.story{min-height:0}h1{font-size:22px}body{padding:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.outline path{stroke-dashoffset:0}.art path,.art line,.art circle,.art rect{stroke-dashoffset:0}header{opacity:1}}
</style>
</head>
<body>
<header><h1><span class="dot"></span>Museum of Almost</h1><div class="sub">THREE EXHIBITS / NONE OF THEM HAPPENED<br>ACCESSION 044 · DEPARTMENT OF NEAR EVENTS</div></header>
<div class="gallery" id="gallery"></div>
<footer><span id="progress">00 / 03 EXHIBITS RECOVERED</span><button id="reset" type="button">RESET MUSEUM</button></footer>
<script>
const exhibits=[
 {no:'044.1',title:'The Call You Almost Answered',story:'It rang at 11:40 on a Tuesday. You watched it until the screen went dark, then said you had been in the bath. The voice left no message. You kept the number for eleven years.',paths:['M20 78 h60 a8 8 0 0 1 8 8 v86 a8 8 0 0 1-8 8 H20 a8 8 0 0 1-8-8 V86 a8 8 0 0 1 8-8 Z','M28 92 l32 25 32-25','M20 168 l30-25','M88 168 l-30-25','M70 42 q-10-18 4-26 q14-8 4-26']},
 {no:'044.2',title:'The Train You Almost Caught',story:'The 6:14 to Hartlepool. You were forty seconds from the barrier when you turned back for a receipt you never used. The train left with a woman reading a paperback whose last page you still wonder about.',paths:['M8 150 h124 M18 150 v-58 l12-18 h68 l16 18 v58','M30 74 v58 M100 74 v58','M18 112 h104','M34 142 a7 7 0 1 0 14 0 a7 7 0 1 0-14 0','M92 142 a7 7 0 1 0 14 0 a7 7 0 1 0-14 0','M54 40 l-8 14 M76 34 l8 18']},
 {no:'044.3',title:'The Sentence You Almost Sent',story:'You wrote: “I think about that evening more than I should.” You read it twice, added a full stop, removed it, added a smile, removed the smile. The cursor blinked for six minutes. You closed the window without saving.',paths:['M14 50 h112 v104 H14 Z M14 50 l56 56 56-56','M26 178 L186 40 M28 40 l158 138','M40 70 h30 M40 82 h18','M86 170 h30']}
];
const gallery=document.getElementById('gallery'),progress=document.getElementById('progress'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
exhibits.forEach((ex,i)=>{const c=document.createElement('button');c.type='button';c.className='case';c.setAttribute('aria-label','Reveal '+ex.title);c.innerHTML=`<div class="vitrine"><svg class="outline" viewBox="0 0 200 200" preserveAspectRatio="none"><path style="--i:${i}" d="M2 2 H198 V198 H2 Z M2 2 L198 198 M198 2 L2 198"/></svg><svg class="art" viewBox="0 0 200 200">${ex.paths.map((d,p)=>`<path style="--p:${p};--len:500" d="${d}"/>`).join('')}</svg></div><div class="meta"><div class="no">${ex.no}</div><div class="title">${ex.title}</div><div class="story" data-story="${ex.story}">NOT YET ACQUIRED — THE OBJECT IS ABSENT.</div></div>`;c.addEventListener('click',()=>open(c,i,ex.story));gallery.appendChild(c)});
function open(c,i,story){if(c.classList.contains('open'))return;c.classList.add('open');const el=c.querySelector('.story');if(reduce){el.textContent=story}else{el.textContent='';let n=0;const t=setInterval(()=>{el.textContent=story.slice(0,++n);if(n>=story.length)clearInterval(t)},22)}const count=document.querySelectorAll('.case.open').length;progress.textContent=String(count).padStart(2,'0')+' / 03 EXHIBITS RECOVERED'}
document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('.case').forEach(c=>{c.classList.remove('open');c.querySelector('.story').textContent='NOT YET ACQUIRED — THE OBJECT IS ABSENT.'});progress.textContent='00 / 03 EXHIBITS RECOVERED'});
document.addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const cases=[...document.querySelectorAll('.case')],cur=cases.indexOf(document.activeElement),next=e.key==='ArrowRight'?(cur+1)%3:(cur+2)%3;cases[next].focus()});
</script>
</body>
</html>
