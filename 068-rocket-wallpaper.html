<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long-Duration Wallpaper — Habitat Linen, Lot 06</title>
<style>
:root{--a:#CDE6DA;--b:#E9BFC2;--c:#F7F2E8;--ink:#3C5D57;--old:#CDE6DA}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--c);color:var(--ink);font-family:Arial,Helvetica,sans-serif;transition:background .7s,color .7s}
body{padding:26px 30px}
header{display:flex;justify-content:space-between;align-items:flex-end;max-width:1100px;margin:0 auto 18px;gap:20px}
h1{font:400 clamp(22px,3.2vw,38px)/1.05 Georgia,serif;margin:0;max-width:520px}
.meta{font:9px ui-monospace,Menlo,monospace;letter-spacing:.18em;line-height:1.8;text-align:right}
.panel{position:relative;max-width:1100px;margin:auto;border:1px solid var(--ink);height:min(60vh,540px);min-height:360px;overflow:hidden;clip-path:inset(0 0 100% 0);animation:unroll 1.5s cubic-bezier(.18,.9,.2,1) forwards;background:var(--c)}
@keyframes unroll{to{clip-path:inset(0 0 0 0)}}
.panel svg{width:100%;height:100%;display:block}
.panel svg *{transition:fill .85s ease,stroke .85s ease}
.panel:after{content:'';position:absolute;inset:0;background:var(--old);pointer-events:none;opacity:0;transform:translateX(-101%)}
.panel.wipe:after{animation:wipe .95s cubic-bezier(.5,0,.2,1)}
@keyframes wipe{0%{opacity:.85;transform:translateX(-101%)}100%{opacity:0;transform:translateX(101%)}}
.stamp{position:absolute;top:18px;left:20px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--ink);background:var(--c);padding:8px 10px;border:1px solid var(--ink)}
.swatches{max-width:1100px;margin:14px auto 0;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{background:none;border:1px solid var(--ink);padding:7px;cursor:pointer;color:inherit;text-align:left;transition:transform .3s,background .3s}
.sw:hover{transform:translateY(-4px)}.sw:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sw svg{width:100%;height:42px;display:block}
.sw span{display:block;font:8px ui-monospace,Menlo,monospace;letter-spacing:.13em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw[aria-pressed="true"]{background:var(--c);box-shadow:inset 0 0 0 2px var(--ink)}
.note{max-width:1100px;margin:16px auto 0;font:italic 13px/1.6 Georgia,serif;opacity:.75}
@media(max-width:700px){.swatches{grid-template-columns:repeat(3,1fr)}.panel{height:48vh}.meta{font-size:7px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.panel{clip-path:none}}
</style>
</head>
<body>
<header><h1>Habitat linen for a long trip</h1><div class="meta">LOT 06 · REPEAT 120 CM<br>1,100 DAYS OF THE SAME VIEW<br>WEAVE: ORBIT / SEED / STAR</div></header>
<div class="panel" id="panel"><svg viewBox="0 0 1100 540" preserveAspectRatio="xMidYMid slice"><defs><pattern id="weave" width="140" height="140" patternUnits="userSpaceOnUse"><rect width="140" height="140" fill="var(--c)"/><g stroke="var(--a)" stroke-width="1" opacity=".65"><path d="M0 18 H140 M0 46 H140 M0 74 H140 M0 102 H140 M0 130 H140 M18 0 V140 M46 0 V140 M74 0 V140 M102 0 V140 M130 0 V140"/></g><path d="M8 112 Q35 62 78 90 T138 40" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".55"/><g fill="var(--b)" stroke="var(--ink)" stroke-width="1.4"><path d="M35 30 q12 -18 24 0 q-12 18 -24 0Z"/><path d="M98 100 q10 -15 21 0 q-11 15 -21 0Z"/></g><g stroke="var(--ink)" stroke-width="1.5" opacity=".9"><path d="M70 18 v16 M62 26 h16 M112 48 v12 M106 54 h12 M26 84 v12 M20 90 h12"/></g><g fill="var(--a)" stroke="var(--ink)" stroke-width="1"><circle cx="118" cy="22" r="5"/><circle cx="18" cy="122" r="5"/><circle cx="72" cy="72" r="3"/></g><path d="M44 126 h50" stroke="var(--b)" stroke-width="4"/></pattern></defs><rect width="1100" height="540" fill="url(#weave)"/><path d="M0 486 H1100" stroke="var(--ink)" stroke-width="2" opacity=".35"/></svg><div class="stamp">SPECIMEN 068 · CREW QUARTERS B</div></div>
<div class="swatches" id="swatches"></div>
<div class="note">The pattern was chosen so that a missing crew member would not make the room feel emptier. Six moods were printed; none of them is called cheerful.</div>
<script>
const palettes=[
 {n:'ORBIT MINT',a:'#CDE6DA',b:'#E9BFC2',c:'#F7F2E8',ink:'#3C5D57'},
 {n:'DUSK PEACH',a:'#E9BFC2',b:'#CDE6DA',c:'#F7F2E8',ink:'#6A4B4E'},
 {n:'SIGNAL RED',a:'#D9644F',b:'#E8D5B5',c:'#F5EEE1',ink:'#2A3E4C'},
 {n:'ALGAE',a:'#9FBFA8',b:'#D7E3C8',c:'#F3F2DF',ink:'#3B5A4E'},
 {n:'LUNAR BLUE',a:'#B9CEDD',b:'#E6D9C8',c:'#F4F1E8',ink:'#334A61'},
 {n:'HULL GREY',a:'#C7C6BC',b:'#E4D7C4',c:'#F5F1E7',ink:'#3F4547'}
];
const root=document.documentElement,panel=document.getElementById('panel'),swatches=document.getElementById('swatches'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function swatchSvg(p){return '<svg viewBox="0 0 120 42" aria-hidden="true"><rect width="120" height="42" fill="'+p.c+'"/><g stroke="'+p.a+'" stroke-width="1"><path d="M0 10H120M0 30H120M20 0V42M60 0V42M100 0V42"/></g><path d="M6 32 Q28 6 58 26 T116 10" fill="none" stroke="'+p.ink+'" stroke-width="1.4"/><path d="M35 12 q9 -13 18 0 q-9 13 -18 0Z" fill="'+p.b+'" stroke="'+p.ink+'" stroke-width="1"/><circle cx="92" cy="31" r="4" fill="'+p.a+'" stroke="'+p.ink+'" stroke-width="1"/></svg>'}
palettes.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='sw';b.setAttribute('aria-pressed',i===0);b.setAttribute('aria-label','Apply '+p.n+' wallpaper');b.innerHTML=swatchSvg(p)+'<span>'+p.n+'</span>';b.addEventListener('click',()=>apply(i,b));swatches.appendChild(b)});
function apply(i,btn){const p=palettes[i];root.style.setProperty('--old',getComputedStyle(root).getPropertyValue('--a').trim());['a','b','c','ink'].forEach(k=>root.style.setProperty('--'+k,p[k]));document.querySelectorAll('.sw').forEach(s=>s.setAttribute('aria-pressed',s===btn));panel.classList.remove('wipe');void panel.offsetWidth;if(!reduce)panel.classList.add('wipe')}
</script>
</body>
</html>
