<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herbarium After Rain — Plates That Unfurl Wet</title>
<style>
:root{--paper:#E8DCC0;--green:#3F5E42;--ink:#3A2F27}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}
body{padding:34px 8vw 90px;background-image:radial-gradient(rgba(58,47,39,.07) 1px,transparent 1px),repeating-linear-gradient(0deg,rgba(58,47,39,.018) 0 1px,transparent 1px 6px);background-size:9px 9px,100% 6px}
header{border-bottom:1px solid var(--ink);padding-bottom:14px;display:flex;justify-content:space-between;align-items:end;gap:20px;opacity:0;animation:fade 1s forwards}
@keyframes fade{to{opacity:1}}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(23px,3.2vw,40px);line-height:1;margin:0}
.meta{font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em;text-align:right}
.plate{display:grid;grid-template-columns:150px 1fr 230px;gap:34px;align-items:center;min-height:520px;border-bottom:1px solid rgba(58,47,39,.4)}
.plate:nth-child(odd){grid-template-columns:230px 1fr 150px}
.plate:nth-child(odd) .note{grid-column:1}.plate:nth-child(odd) .plant{grid-column:2}.plate:nth-child(odd) .label{grid-column:3;text-align:right}
.pin{width:13px;height:13px;border-radius:50%;background:var(--ink);border:0;cursor:pointer;outline:none;position:relative}
.pin:focus-visible{outline:3px solid var(--green);outline-offset:4px}
.pin:after{content:'';position:absolute;left:6px;top:11px;width:1px;height:18px;background:var(--ink)}
.plant{position:relative}
.plant svg{width:100%;height:430px;display:block;overflow:visible}
.stem,.leaf{fill:none;stroke:var(--green);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset 1.6s cubic-bezier(.55,.05,.25,1)}
.plate.drawn .stem{stroke-dashoffset:0}.plate.drawn .leaf{stroke-dashoffset:0;transition-delay:calc(.35s + var(--n)*.22s)}
.label .no{font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--green)}
.label h2{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(20px,2.4vw,30px);line-height:1.1;margin:10px 0 14px}
.note{font-family:Georgia,serif;font-style:italic;font-size:14px;line-height:1.6;max-width:30ch;opacity:0;transform:translateY(10px);transition:opacity .8s .9s,transform .8s .9s}
.plate.drawn .note{opacity:.78;transform:none}
.drop{fill:#8FA9A6;opacity:0}
.plate.drawn .drop{animation:bead 2.4s cubic-bezier(.3,.7,.3,1) 2.1s forwards;animation-delay:calc(2.1s + var(--d)*.4s)}
@keyframes bead{0%{opacity:0;transform:translateY(-8px) scale(.3)}25%{opacity:.9;transform:none}65%{transform:translateY(0) scale(1)}100%{opacity:.85;transform:translateY(var(--fall)) scale(.75)}}
@media(max-width:800px){.plate,.plate:nth-child(odd){grid-template-columns:1fr;gap:10px;min-height:0;padding:40px 0}.plate:nth-child(odd) .note,.plate:nth-child(odd) .plant,.plate:nth-child(odd) .label,.label,.plant,.note{grid-column:1;text-align:left}.plant svg{height:300px}body{padding:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}header{opacity:1}.stem,.leaf{stroke-dashoffset:0}.note{opacity:.78;transform:none}}
</style>
</head>
<body>
<header><h1>Herbarium, After Rain</h1><div class="meta">SHEETS 053.I–IV<br>COLLECTED WHILE STILL WET</div></header>
<div id="plates"></div>
<script>
const plants=[
 {no:'053.I',name:'Field Gentian',note:'17 Sept. — From the north ditch, still dripping. The flowers had closed against the weather and would not open again indoors.',
  paths:['M210 410 C205 340 214 280 208 210 C203 150 214 96 220 44','M209 330 C170 310 146 280 130 246 C162 244 190 262 209 292','M210 286 C254 268 280 236 292 204 C258 206 230 226 210 254','M214 190 C178 172 158 142 150 112 C180 116 204 136 214 164','M217 150 C254 134 274 108 282 78 C252 82 230 104 217 128','M220 70 q-14-20-2-38 q16 16 2 38 M220 70 q14-20 2-38 q-16 16-2 38']},
 {no:'053.II',name:'Round-leaved Sundew',note:'2 Oct. — The bog was ankle-deep. Each leaf held a bead of water large enough to distort the writing on the label.',
  paths:['M210 410 C212 340 208 270 212 190 C214 144 210 108 208 74','M210 350 C160 344 128 316 116 282 C150 278 186 300 210 326','M211 290 C264 286 296 258 308 224 C272 222 236 244 211 270','M211 226 C166 220 138 194 128 162 C162 160 194 182 211 208','M211 166 C258 162 286 138 296 108 C262 106 232 128 211 150','M208 100 C176 92 160 70 156 46 C180 50 200 68 208 88 M208 100 C240 92 256 70 260 46 C236 50 216 68 208 88']},
 {no:'053.III',name:'Marsh Thistle',note:'9 Aug. — Cut from the bank below the mill. A single drop ran from the lowest bract for a full minute after pressing.',
  paths:['M210 410 C204 340 218 280 210 214 C204 160 216 110 212 60','M210 320 C164 304 136 270 124 232 C158 234 190 262 210 292','M212 260 C260 244 290 212 300 178 C264 180 232 204 212 232','M212 190 C176 172 154 142 148 110 C180 114 204 140 212 166','M212 110 C158 94 136 62 132 32 C166 40 194 68 212 94 M212 110 C266 94 288 62 292 32 C258 40 230 68 212 94','M212 78 l-18-24 M212 78 l18-24 M212 60 l-22-14 M212 60 l22-14']},
 {no:'053.IV',name:'Water Avens',note:'24 June — Found beside the culvert. The stem bent under the weight of a drop; I drew it exactly as it hung.',
  paths:['M210 410 C216 350 204 290 212 226 C220 170 206 118 214 68','M212 350 C168 342 140 316 128 282 C162 278 194 302 212 330','M212 286 C260 278 288 250 300 216 C264 214 232 238 212 266','M214 220 C176 208 152 180 144 148 C176 152 202 176 214 202','M214 152 C252 140 276 114 284 84 C252 88 228 112 214 136','M214 80 C186 56 190 30 214 12 C238 30 242 56 214 80 M214 46 l-24-10 M214 46 l24-10']}
];
const wrap=document.getElementById('plates'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
plants.forEach((p,i)=>{const d=document.createElement('section');d.className='plate';const drops=[0,1,2].map(k=>`<circle class="drop" style="--d:${k};--fall:${40+k*70}px" cx="${180+k*32}" cy="${360-k*110}" r="${4+k}"/>`).join('');d.innerHTML=`<button class="pin" type="button" aria-label="Redraw ${p.name}"></button><div class="plant"><svg viewBox="0 0 420 430">${p.paths.map((path,n)=>`<path class="${n?'leaf':'stem'}" style="--n:${n}" d="${path}"/>`).join('')}${drops}</svg></div><div class="label"><div class="no">${p.no}</div><h2>${p.name}</h2></div><div class="note">${p.note}</div>`;wrap.appendChild(d);const pin=d.querySelector('.pin');pin.addEventListener('click',()=>{d.classList.remove('drawn');void d.offsetWidth;d.classList.add('drawn')});if(reduce)d.classList.add('drawn')});
if(!reduce){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('drawn');io.unobserve(e.target)}}),{threshold:.35});document.querySelectorAll('.plate').forEach(p=>io.observe(p))}
</script>
</body>
</html>
