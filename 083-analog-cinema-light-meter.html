<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exposure No. 083 — An Analog Cinema Light Meter</title>
<style>
:root{--amber:#D98F36;--black:#181512;--cream:#F1E3C8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:var(--cream);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{padding:24px 28px;background-image:radial-gradient(circle at 70% 30%,rgba(217,143,54,.09),transparent 60%)}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(241,227,200,.35);padding-bottom:9px}
h1{font:400 clamp(20px,2.8vw,32px)/1 Georgia,serif;margin:0;color:var(--amber)}
.meta{font:9px ui-monospace,Menlo,monospace;letter-spacing:.18em}
.instrument{display:flex;gap:30px;height:calc(100vh - 120px);min-height:480px;align-items:center;justify-content:center}
.gauge{position:relative;width:min(640px,60vw);max-width:640px;aspect-ratio:640/400;background:#211D18;border:2px solid var(--amber);border-radius:14px;box-shadow:inset 0 0 50px rgba(0,0,0,.7),0 12px 30px rgba(0,0,0,.5);overflow:hidden;cursor:crosshair;touch-action:none}
.gauge:focus-visible{outline:2px dashed var(--cream);outline-offset:4px}
svg{width:100%;height:100%;display:block}
.beam{position:absolute;left:-30%;top:0;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(217,143,54,.22),transparent);transform:skewX(-20deg);opacity:0;transition:opacity .4s;pointer-events:none}
.open .beam{opacity:1;animation:sweep 3s ease-in-out infinite alternate}
@keyframes sweep{to{left:85%}}
.reading{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);text-align:center;pointer-events:none}
.fstop{font:400 clamp(28px,5vw,54px)/1 Georgia,serif;color:var(--amber)}
.reading small{display:block;font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;margin-top:6px;color:rgba(241,227,200,.7)}
.panel{width:210px;flex:none;display:flex;flex-direction:column;align-items:center;gap:18px}
.iris{position:relative;width:180px;height:180px;border-radius:50%;border:2px solid var(--amber);background:#0E0C0B;cursor:pointer;overflow:hidden;transition:transform .18s}
.iris:hover{transform:scale(1.02)}.iris:focus-visible{outline:2px solid var(--cream);outline-offset:5px}
.blade{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;background:linear-gradient(135deg,#3A3128,#181512);clip-path:polygon(50% 0,100% 100%,0 100%);transform-origin:50% 100%;transform:rotate(var(--a)) translateY(calc(-1 * var(--gap))) rotate(180deg);transition:transform .5s cubic-bezier(.2,1,.3,1),background .3s}
.open .blade{--gap:44px;background:linear-gradient(135deg,#6B4D2A,#2D241B)}
.iris:after{content:'';position:absolute;inset:42%;border-radius:50%;background:var(--amber);box-shadow:0 0 30px var(--amber);opacity:.8;transition:opacity .3s}
.open .iris:after{opacity:.2}
.iris-button{font:10px ui-monospace,Menlo,monospace;letter-spacing:.2em;border:1px solid var(--amber);background:transparent;color:var(--amber);padding:9px 14px;cursor:pointer}
.iris-button:hover{background:var(--amber);color:var(--black)}
.notes{font:italic 12px/1.7 Georgia,serif;color:rgba(241,227,200,.65);text-align:center}
@media(max-width:760px){body{padding:12px}.instrument{flex-direction:column;gap:14px;min-height:0}.gauge{width:92vw}.panel{width:auto;flex-direction:row;flex-wrap:wrap;justify-content:center}.iris{width:110px;height:110px}.blade{width:48px;height:48px;margin:-24px 0 0 -24px}.notes{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1>Exposure No. 083</h1><span class="meta">CINEMA METER · TYPE VI · READY</span></header>
<div class="instrument" id="instrument">
  <div class="gauge" id="gauge" tabindex="0" aria-label="Analog light meter gauge; move pointer or use arrow keys"><div class="beam"></div>
    <svg viewBox="0 0 640 400" aria-hidden="true"><path d="M90 300 A250 250 0 0 1 550 300" fill="none" stroke="rgba(241,227,200,.45)" stroke-width="2"/><g id="ticks"></g><line id="needle" x1="320" y1="300" x2="320" y2="110" stroke="#D98F36" stroke-width="4" stroke-linecap="round"/><circle cx="320" cy="300" r="15" fill="#D98F36"/><circle cx="320" cy="300" r="6" fill="#181512"/></svg>
    <div class="reading"><div class="fstop" id="fstop">f/5.6</div><small id="mode">MOVEMENT · HOLD STILL</small></div>
  </div>
  <div class="panel">
    <div class="iris" id="iris" role="button" tabindex="0" aria-label="Toggle the camera shutter"></div>
    <button class="iris-button" id="toggle" type="button">SHUTTER: CLOSED</button>
    <div class="notes">Move quickly across the dial to open the aperture. Click the iris to hold a frame.</div>
  </div>
</div>
<script>
const gauge=document.getElementById('gauge'),ticks=document.getElementById('ticks'),needle=document.getElementById('needle'),fstop=document.getElementById('fstop'),mode=document.getElementById('mode'),iris=document.getElementById('iris'),toggle=document.getElementById('toggle'),instrument=document.getElementById('instrument'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,stops=['f/2','f/2.8','f/4','f/5.6','f/8','f/11','f/16'];
for(let i=0;i<7;i++){const a=Math.PI+(i/6)*Math.PI,x1=320+Math.cos(a)*238,y1=300+Math.sin(a)*238,x2=320+Math.cos(a)*(i%2?218:205),y2=300+Math.sin(a)*(i%2?218:205);ticks.insertAdjacentHTML('beforeend','<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(i%2?'rgba(241,227,200,.4)':'#F1E3C8')+'" stroke-width="'+(i%2?1:2)+'"/>')}
for(let i=0;i<6;i++){const b=document.createElement('div');b.className='blade';b.style.setProperty('--a',i*60+'deg');b.style.setProperty('--gap','20px');iris.appendChild(b)}
let value=.5,target=.5,last=null,ac=null;
function render(){const a=-90+value*180;needle.setAttribute('transform','rotate('+a+' 320 300)');fstop.textContent=stops[Math.min(6,Math.floor(value*6.999))];mode.textContent=value>.8?'FAST · WIDE APERTURE':value<.25?'SLOW · STOPPED DOWN':'MOVEMENT · HOLD STILL'}
function click(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(60,t+.06);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.0001,t+.09);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.1)}
function frame(){target+=(target-value)*.12;value+=(target-value)*.18;render();requestAnimationFrame(frame)}
gauge.addEventListener('pointermove',e=>{if(reduce)return;const now=performance.now(),r=gauge.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(last){const v=Math.hypot(x-last.x,y-last.y)/Math.max(16,now-last.t);target=Math.max(0,Math.min(1,.22+v*.9))}last={x,y,t:now}});
gauge.addEventListener('pointerleave',()=>{last=null;target=.5});
gauge.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')target=Math.max(0,target-.1);else if(e.key==='ArrowRight')target=Math.min(1,target+.1);else return;e.preventDefault()});
function shutter(){click();const open=instrument.classList.toggle('open');toggle.textContent='SHUTTER: '+(open?'OPEN':'CLOSED')}
iris.addEventListener('click',shutter);iris.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();shutter()}});toggle.addEventListener('click',shutter);
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();shutter()}});
if(reduce){value=target=.5;render()}else{const start=performance.now();function sweep(t){const k=Math.min(1,(t-start)/2100);value=k<.7?(k/.7):1-(k-.7)/.3*.5;target=value;render();if(k<1)requestAnimationFrame(sweep);else{target=.5;frame()}}requestAnimationFrame(sweep)}
</script>
</body>
</html>
