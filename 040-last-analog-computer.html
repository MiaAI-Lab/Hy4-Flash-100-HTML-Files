<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Analog Computer — A Machine That Only Knows One Sentence</title>
<style>
:root{--walnut:#5B3B29;--brass:#C6A15B;--cream:#EFE3C8;--dark:#2E1E15}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--dark);color:var(--cream);font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.machine{position:relative;width:min(96vw,1180px);height:min(88vh,680px);background:var(--walnut);border:6px solid #3A2518;box-shadow:inset 0 0 0 2px rgba(239,227,200,.12),0 30px 60px rgba(0,0,0,.45);padding:58px 40px 76px;display:flex;flex-direction:column}
.rail{position:absolute;left:0;right:0;top:0;height:48px;background:#3A2518;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:2px solid var(--brass);font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--brass)}
.answer{height:58px;background:var(--brass);color:var(--dark);display:flex;align-items:center;justify-content:center;font:400 clamp(19px,2.4vw,34px)/1 Georgia,serif;letter-spacing:.12em;margin-bottom:22px;position:relative}
.answer:after{content:'';position:absolute;left:12px;right:12px;bottom:7px;border-bottom:1px solid rgba(46,30,21,.35)}
.bed{flex:1;display:flex;justify-content:center;gap:clamp(4px,.9vw,14px);position:relative;min-height:0}
.rod{position:relative;width:clamp(28px,4.1vw,54px);background:var(--brass);box-shadow:inset -3px 0 rgba(46,30,21,.25);border-radius:6px}
.rod.clack{animation:clack .3s ease-out}
@keyframes clack{50%{transform:translateY(4px)}}
.bead{position:absolute;left:50%;width:calc(100% + 12px);height:36px;margin-left:calc(-50% - 6px);background:var(--cream);color:var(--dark);border:2px solid #CDBB93;border-radius:18px;display:grid;place-items:center;font:700 13px ui-monospace,Menlo,monospace;cursor:grab;outline:none;touch-action:none;transition:top .4s cubic-bezier(.2,1.3,.3,1);box-shadow:0 3px 0 rgba(46,30,21,.3);animation:drop .5s cubic-bezier(.2,1.2,.3,1) both;animation-delay:calc(var(--b)*.045s)}
@keyframes drop{from{transform:translateY(-90px);opacity:0}to{transform:none;opacity:1}}
.bead:focus-visible{outline:3px solid var(--dark)}
.bead.active{background:var(--brass);border-color:var(--cream);box-shadow:0 0 0 2px rgba(239,227,200,.25)}
.crank{position:absolute;right:-34px;top:36%;width:56px;height:56px;border:5px solid var(--brass);border-radius:50%;background:transparent;cursor:pointer;outline:none}
.crank:before{content:'';position:absolute;left:50%;top:-22px;width:8px;height:56px;background:var(--brass);transform-origin:50% 100%}
.crank:hover:before{transform:rotate(35deg)}
.crank:focus-visible{outline:3px solid var(--cream)}
.drawer{position:absolute;left:50%;bottom:0;width:min(52%,440px);height:70px;background:#3A2518;border:2px solid var(--brass);border-bottom:0;transform:translate(-50%,100%);transition:transform .7s cubic-bezier(.2,.9,.2,1.05);display:grid;place-items:center;z-index:3}
.drawer.open{transform:translate(-50%,0)}
.card{background:var(--cream);color:var(--dark);padding:9px 18px;font:italic 16px Georgia,serif;white-space:nowrap}
.hint{position:absolute;left:26px;bottom:22px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--brass)}
@media(max-width:700px){.machine{padding:48px 12px 60px;height:86vh}.rail{font-size:6px;padding:0 8px}.bead{height:30px;font-size:10px}.answer{font-size:17px}.crank{right:-14px;width:38px;height:38px}.hint{font-size:6px}.card{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="machine">
  <div class="rail"><span>THE LAST ANALOG COMPUTER</span><span>BUILT 1974 / NEVER CONNECTED TO ANYTHING</span></div>
  <div class="answer" id="answer">— — — — — — — — — — — — — —</div>
  <div class="bed" id="bed"></div>
  <button class="crank" id="crank" type="button" aria-label="Scramble all beads"></button>
  <div class="drawer" id="drawer"><div class="card">WE KNEW YOU WOULD ASK.</div></div>
  <div class="hint">DRAG A BEAD TO THE TOP STOP · SPACE TO TOGGLE</div>
</div>
<script>
const bed=document.getElementById('bed'),answer=document.getElementById('answer'),crank=document.getElementById('crank'),drawer=document.getElementById('drawer');
const target='WEArestillhere'.toUpperCase().split(''),letters=target.slice();
const decoys='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const rods=[],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rodHeight(){return bed.getBoundingClientRect().height||300}
letters.forEach((ch,i)=>{
 const rod=document.createElement('div');rod.className='rod';
 const set=new Set([ch]);while(set.size<4)set.add(decoys[Math.floor(Math.random()*26)]);
 const chars=[...set].sort();
 chars.forEach((c,k)=>{
  const b=document.createElement('button');b.type='button';b.className='bead';b.textContent=c;b.style.setProperty('--b',i*4+k);
  const slot=1+Math.floor(Math.random()*3);b.dataset.slot=slot;
  b.style.top=`calc(100% - ${36+slot*40}px)`;
  let dragging=false,startY=0,startSlot=slot;
  b.addEventListener('pointerdown',e=>{dragging=true;startY=e.clientY;startSlot=+b.dataset.slot;b.setPointerCapture(e.pointerId);b.style.transition='none'});
  b.addEventListener('pointermove',e=>{if(!dragging)return;const delta=(e.clientY-startY)/40;const s=Math.max(0,Math.min(3,Math.round(startSlot-delta)));b.dataset.slot=s;b.style.top=s===0?'0px':`calc(100% - ${36+s*40}px)`;if(s===0){rod.querySelectorAll('.bead').forEach(q=>{if(q!==b&&+q.dataset.slot===0){q.dataset.slot=1;q.style.top=`calc(100% - 76px)`}})}});
  b.addEventListener('pointerup',()=>{dragging=false;b.style.transition='';setSlot(b,+b.dataset.slot)});
  b.addEventListener('pointercancel',()=>{dragging=false;b.style.transition='';setSlot(b,+b.dataset.slot)});
  b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();setSlot(b,+b.dataset.slot===0?1:0)}});
  rod.appendChild(b)
 });
 bed.appendChild(rod);rods.push(rod)
});
function setSlot(b,s){b.dataset.slot=s;b.style.top=s===0?'0px':`calc(100% - ${36+s*40}px)`;check()}
function current(){return rods.map(r=>{const a=[...r.querySelectorAll('.bead')].find(b=>+b.dataset.slot===0);return a?a.textContent:''})}
function check(){const s=current();let out='';s.forEach((c,i)=>{out+=c||'—';if(i===1||i===4||i===9)out+='  '});answer.textContent=out;const solved=s.every((c,i)=>c===target[i]);if(solved){drawer.classList.add('open');answer.textContent='WE ARE STILL HERE';rods.forEach((r,i)=>setTimeout(()=>{r.classList.add('clack');setTimeout(()=>r.classList.remove('clack'),300)},i*55))}else drawer.classList.remove('open')}
crank.addEventListener('click',()=>{rods.forEach(r=>{const bs=[...r.querySelectorAll('.bead')];bs.forEach(b=>{b.dataset.slot=1+Math.floor(Math.random()*3);b.style.top=`calc(100% - ${36+(+b.dataset.slot)*40}px)`})});check()});
window.addEventListener('resize',()=>{rods.forEach(r=>[...r.querySelectorAll('.bead')].forEach(b=>{const s=+b.dataset.slot;b.style.top=s===0?'0px':`calc(100% - ${36+s*40}px)`}))});
check();
</script>
</body>
</html>
