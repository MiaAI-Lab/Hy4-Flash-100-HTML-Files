<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviary of Shapes — Sixty Birds, One Decision</title>
<style>
:root{--cream:#F5EEDF;--teal:#2E9C9A;--coral:#DC715D}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream);color:#264B4A;font-family:Arial,Helvetica,sans-serif}
body{padding:24px 28px;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(38,75,74,.35);padding-bottom:10px}
h1{font:400 clamp(21px,3vw,34px)/1 Georgia,serif;margin:0}
.meta{font:9px ui-monospace,Menlo,monospace;letter-spacing:.18em}
svg{display:block;width:100%;height:calc(100vh - 120px);min-height:460px;touch-action:none}
.bird .flap{transform-box:fill-box;transform-origin:center;animation:flap .75s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.037s)}
@keyframes flap{from{transform:scaleY(.5)}to{transform:scaleY(1.15)}}
.hold .bird .flap{animation-play-state:paused;transform:scaleY(1)}
.path{fill:none;stroke:rgba(38,75,74,.1);stroke-width:1}
.cmd{position:absolute;right:28px;top:92px;background:none;border:1px solid #264B4A;color:#264B4A;padding:10px 16px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;cursor:pointer}
.cmd:hover{background:rgba(46,156,154,.12)}.cmd:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
.hint{position:absolute;left:28px;bottom:24px;font:italic 13px Georgia,serif;color:#6C8A88;pointer-events:none}
@media(prefers-reduced-motion:reduce){.bird .flap{animation:none}}
</style>
</head>
<body>
<header><h1>Sixty birds, one decision</h1><span class="meta">AVIARY 073 · FIELD STUDY IN AGREEMENT</span></header>
<button class="cmd" id="cmd" type="button">FORMATION</button><div class="hint">Move through the flock. Then give it one order.</div>
<svg id="svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-label="Flock of geometric birds"><g id="ghosts"></g><g id="flock"></g></svg>
<script>
const svg=document.getElementById('svg'),flock=document.getElementById('flock'),ghosts=document.getElementById('ghosts'),cmd=document.getElementById('cmd'),N=60,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const birds=[];let formation=false,pointer={x:-999,y:-999},holdUntil=0;
for(let i=0;i<N;i++){
 const row=Math.floor(i/2),side=i%2?1:-1,fx=855-row*24,fy=300+side*row*12;
 const g=document.createElementNS('http://www.w3.org/2000/svg','g'),inner=document.createElementNS('http://www.w3.org/2000/svg','g'),p=document.createElementNS('http://www.w3.org/2000/svg','path');
 inner.setAttribute('class','flap');inner.style.setProperty('--i',i);p.setAttribute('d','M13 0 L-11 -10 L-4 0 L-11 10 Z');p.setAttribute('fill',i%3===0?'var(--coral)':'var(--teal)');p.setAttribute('stroke','#264B4A');p.setAttribute('stroke-width','.7');inner.appendChild(p);g.appendChild(inner);flock.appendChild(g);
 const a=i*2.399,r=90+Math.sqrt(i)*58;birds.push({g,x:500+Math.cos(a)*r,y:300+Math.sin(a)*r*.65,vx:0,vy:0,fx,fy,angle:0,phase:i*.7});
 if(i%6===0){const ghost=document.createElementNS('http://www.w3.org/2000/svg','circle');ghost.setAttribute('cx',fx);ghost.setAttribute('cy',fy);ghost.setAttribute('r','2');ghost.setAttribute('fill','rgba(38,75,74,.22)');ghosts.appendChild(ghost)}
}
function svgPoint(e){const r=svg.getBoundingClientRect(),q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const m=svg.getScreenCTM().inverse();return q.matrixTransform(m)}
svg.addEventListener('pointermove',e=>{const p=svgPoint(e);pointer.x=p.x;pointer.y=p.y});svg.addEventListener('pointerleave',()=>{pointer.x=pointer.y=-999});
cmd.addEventListener('click',()=>{formation=!formation;cmd.textContent=formation?'SCATTER':'FORMATION';ghosts.style.opacity=formation?'0':'1';if(formation){holdUntil=performance.now()+2000;if(reduce)birds.forEach(b=>{b.x=b.fx;b.y=b.fy})}});
function frame(t){svg.classList.toggle('hold',formation&&t<holdUntil);birds.forEach((b,i)=>{let tx,ty,k;if(formation){tx=b.fx;ty=b.fy;k=.045}else{tx=500+Math.cos(t*.00035+b.phase)*270+Math.sin(b.phase)*55;ty=300+Math.sin(t*.00042+b.phase*1.3)*155;k=.012}let ax=(tx-b.x)*k,ay=(ty-b.y)*k;const dx=b.x-pointer.x,dy=b.y-pointer.y,d=Math.hypot(dx,dy);if(!formation&&d<110&&d>1){ax+=dx/d*(110-d)*.018;ay+=dy/d*(110-d)*.018}b.vx=(b.vx+ax)*.92;b.vy=(b.vy+ay)*.92;b.x+=b.vx;b.y+=b.vy;const target=Math.atan2(b.vy,b.vx)*180/Math.PI;let diff=target-b.angle;if(diff>180)diff-=360;if(diff<-180)diff+=360;b.angle+=diff*.18;b.g.setAttribute('transform','translate('+b.x.toFixed(1)+' '+b.y.toFixed(1)+') rotate('+b.angle.toFixed(1)+')')});requestAnimationFrame(frame)}
if(reduce){birds.forEach(b=>{b.x=b.fx;b.y=b.fy});formation=true;cmd.textContent='SCATTER';ghosts.style.opacity='0'}requestAnimationFrame(frame);
</script>
</body>
</html>
