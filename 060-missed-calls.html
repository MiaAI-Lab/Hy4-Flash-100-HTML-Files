<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missed Calls — Tape from a Machine That Remembers</title>
<style>
:root{--cream:#EEE8DA;--black:#252321;--red:#B13B33}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--black);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
body{padding:22px 28px 40px;background-image:repeating-linear-gradient(0deg,rgba(37,35,33,.025) 0 1px,transparent 1px 5px)}
h1{font:400 clamp(21px,2.7vw,32px)/1 Georgia,serif;margin:0}
.sub{font:9px ui-monospace,Menlo,monospace;letter-spacing:.18em;margin-top:8px}
.machine{position:relative;max-width:680px;margin:24px auto 0;border:2px solid var(--black);padding:20px 24px 26px;text-align:center}
.led{display:inline-block;width:10px;height:10px;background:var(--red);border-radius:50%;margin-left:8px;vertical-align:middle;animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.cassette{width:260px;height:112px;border:2px solid var(--black);margin:16px auto 0;position:relative;background:#E4DCCB;display:flex;align-items:center;justify-content:space-around}
.reel{width:62px;height:62px;border:2px solid var(--black);border-radius:50%;position:relative;animation:turn 3s linear infinite paused}
.playing .reel{animation-play-state:running}
@keyframes turn{to{transform:rotate(360deg)}}
.reel:before,.reel:after{content:'';position:absolute;left:50%;top:50%;width:16px;height:16px;border:2px solid var(--black);border-radius:50%;transform:translate(-50%,-50%)}
.reel:after{width:4px;height:4px;background:var(--red);border:0}
.slot{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:96px;height:12px;background:var(--black)}
.tape{position:relative;width:300px;max-width:80vw;height:0;margin:0 auto;background:#F5F0E3;border-left:1px solid var(--black);border-right:1px solid var(--black);transition:height .18s linear;overflow:hidden;cursor:pointer;clip-path:polygon(0 0,100% 0,100% 96%,96% 100%,92% 96%,88% 100%,84% 96%,80% 100%,76% 96%,72% 100%,68% 96%,64% 100%,60% 96%,56% 100%,52% 96%,48% 100%,44% 96%,40% 100%,36% 96%,32% 100%,28% 96%,24% 100%,20% 96%,16% 100%,12% 96%,8% 100%,4% 96%,0 100%)}
.tape:before,.tape:after{content:'';position:absolute;top:0;bottom:0;width:11px;background:repeating-linear-gradient(180deg,transparent 0 12px,var(--black) 12px 17px,transparent 17px 28px)}
.tape:before{left:0}.tape:after{right:0}
.msg{position:absolute;left:24px;right:24px;top:var(--top);font:13px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;text-align:left}
.msg .t{color:var(--red)}
.head{position:absolute;left:50%;top:0;width:34px;height:16px;border-bottom:3px solid var(--red);transform:translateX(-50%);transition:top .15s linear;pointer-events:none}
.controls{display:flex;gap:10px;justify-content:center;margin-top:18px}
button{background:var(--red);border:0;color:#F5F0E3;padding:11px 18px;font:10px ui-monospace,Menlo,monospace;letter-spacing:.2em;cursor:pointer}
button.alt{background:transparent;color:var(--black);border:1px solid var(--black)}
button:hover{filter:brightness(1.12)}
.counter{margin-top:12px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.18em}
@media(max-width:600px){body{padding:14px}.machine{padding:14px}.cassette{width:220px}.msg{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1>Missed Calls</h1><div class="sub">ANSWERING MACHINE / 060 <span class="led" id="led"></span></div>
<div class="machine" id="machine"><div>CASSETTE 04 — UNPLAYED MESSAGES</div><div class="cassette"><div class="reel"></div><div class="reel"></div><div class="slot"></div></div><div class="tape" id="tape"><div class="head" id="head"></div></div><div class="controls"><button id="play" type="button">PLAY</button><button class="alt" id="skip" type="button">SKIP</button><button class="alt" id="rewind" type="button">REWIND</button></div><div class="counter" id="counter">MESSAGES 0 / 4 — TAPE AT 00 CM</div></div>
<script>
const calls=[
 ['23:14','M.','“I am outside the station. It doesn’t matter now.”'],
 ['00:02','DAD','“The kettle is still on. Call when you can.”'],
 ['01:37','NO CALLER','Silence for nine seconds, then a door closing.'],
 ['06:58','M.','“I took the other train. Please don’t wait.”']
];
const tape=document.getElementById('tape'),head=document.getElementById('head'),machine=document.getElementById('machine'),counter=document.getElementById('counter'),led=document.getElementById('led'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let playing=false,idx=0,timer=null,text='';
function msgEl(i){let el=tape.querySelector('[data-i="'+i+'"]');if(!el){el=document.createElement('div');el.className='msg';el.dataset.i=i;el.style.setProperty('--top',(16+i*94)+'px');el.innerHTML='<span class="t">'+calls[i][0]+'</span> — '+calls[i][1]+'<br>';tape.appendChild(el)}return el}
function type(){if(!playing||idx>=calls.length){stop();return}const el=msgEl(idx),full=calls[idx][2];let n=text.length;const step=()=>{if(!playing)return;el.textContent=el.querySelector('.t')?el.innerHTML.split('<br>')[1]||'':'';n++;el.innerHTML='<span class="t">'+calls[idx][0]+'</span> — '+calls[idx][1]+'<br>'+full.slice(0,n);tape.style.height=Math.min(430,18+idx*94+n*.9)+'px';head.style.top=Math.min(420,tape.getBoundingClientRect().height-16)+'px';counter.textContent='MESSAGES '+(idx+1)+' / 4 — TAPE AT '+String(Math.round(tape.offsetHeight/10)).padStart(2,'0')+' CM';if(n<full.length)setTimeout(step,42);else{idx++;text='';setTimeout(()=>{if(playing)type()},700)}};setTimeout(step,420)}
function stop(){playing=false;clearTimeout(timer);machine.classList.remove('playing');led.style.animationPlayState='paused';document.getElementById('play').textContent='PLAY'}
function play(){if(reduce){idx=calls.length;calls.forEach((c,i)=>{const e=msgEl(i);e.innerHTML='<span class="t">'+c[0]+'</span> — '+c[1]+'<br>'+c[2]});tape.style.height='410px';counter.textContent='MESSAGES 4 / 4 — TAPE AT 41 CM';led.style.animation='none';return}if(playing)return;if(idx>=calls.length)reset();playing=true;machine.classList.add('playing');led.style.animationPlayState='running';document.getElementById('play').textContent='PAUSE';type()}
function skip(){if(!playing)return;clearTimeout(timer);const el=msgEl(idx);el.innerHTML='<span class="t">'+calls[idx][0]+'</span> — '+calls[idx][1]+'<br>'+calls[idx][2];idx++;text='';tape.style.height=(18+idx*94)+'px';if(idx>=calls.length)stop();else type()}
function reset(){stop();idx=0;text='';tape.style.height='0px';tape.querySelectorAll('.msg').forEach(e=>e.remove());head.style.top='0px';counter.textContent='MESSAGES 0 / 4 — TAPE AT 00 CM';led.style.animationPlayState='running'}
document.getElementById('play').addEventListener('click',()=>{if(playing)stop();else play()});
document.getElementById('skip').addEventListener('click',skip);
document.getElementById('rewind').addEventListener('click',reset);
tape.addEventListener('click',skip);
setTimeout(()=>{tape.style.height='14px';counter.textContent='MESSAGES 0 / 4 — TAPE AT 01 CM'},900);
</script>
</body>
</html>
