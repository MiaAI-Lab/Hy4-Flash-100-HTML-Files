<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bauhaus Bake Sale — Form Follows Appetite</title>
<style>
:root{--red:#D84032;--yellow:#F0C626;--blue:#2E62A0;--cream:#F3EBDD}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--blue);font-family:Arial,Helvetica,sans-serif}
body{padding:22px 28px;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:end;border-bottom:6px solid var(--blue);padding-bottom:10px;opacity:0;animation:print .6s 1.1s forwards}
@keyframes print{to{opacity:1}}
h1{font:400 clamp(19px,2.5vw,31px)/.95 ui-monospace,Menlo,monospace;letter-spacing:-.02em;margin:0}
h1 b{display:block;font-size:.42em;letter-spacing:.24em;font-weight:400;color:var(--red);margin-top:8px}
.tag{font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em;text-align:right}
.poster{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px;max-width:1100px}
.disc{position:absolute;left:16%;top:56px;width:150px;height:150px;background:var(--yellow);border-radius:50%;z-index:0;transition:left .8s cubic-bezier(.16,1,.3,1),top .8s cubic-bezier(.16,1,.3,1);opacity:0}
.poster.chosen .disc{opacity:1}
.item{position:relative;z-index:1;border:0;background:transparent;color:inherit;cursor:pointer;outline:none;padding:14px 10px;text-align:left;transition:opacity .3s}
.poster.chosen .item:not(.active){opacity:.42}
.item:focus-visible{outline:3px solid var(--red);outline-offset:-6px}
.shape{height:150px;position:relative;display:grid;place-items:center}
.s{width:110px;height:110px;animation:arrive .5s cubic-bezier(.2,1.1,.3,1) both;animation-delay:calc(var(--i)*.12s)}
@keyframes arrive{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
.pretzel{border:22px solid var(--red);border-bottom-color:transparent;border-radius:50%;height:88px;transform:rotate(-20deg)}
.cake{width:112px;height:82px;background:repeating-linear-gradient(90deg,var(--blue) 0 16px,var(--cream) 16px 20px);border:3px solid var(--blue)}
.ring{width:108px;height:108px;border:26px solid var(--red);border-radius:50%;box-shadow:inset 0 0 0 12px var(--cream)}
.streusel{width:0;height:0;border-left:110px solid var(--yellow);border-bottom:110px solid transparent;position:relative}
.streusel:after{content:'';position:absolute;left:-96px;top:12px;width:64px;height:64px;background:repeating-radial-gradient(circle at 30% 30%,var(--red) 0 3px,transparent 4px 12px);border-radius:50%}
.triangle{width:0;height:0;border-left:60px solid transparent;border-right:60px solid transparent;border-bottom:104px solid var(--blue)}
.biscuits{width:112px;height:112px;background:radial-gradient(circle at 28px 28px,var(--red) 22px,transparent 23px),radial-gradient(circle at 84px 28px,var(--red) 22px,transparent 23px),radial-gradient(circle at 28px 84px,var(--red) 22px,transparent 23px),radial-gradient(circle at 84px 84px,var(--red) 22px,transparent 23px)}
.no{font:9px ui-monospace,Menlo,monospace;letter-spacing:.18em;color:var(--red)}
.name{font:400 17px/1.1 ui-monospace,Menlo,monospace;letter-spacing:.02em;margin:6px 0 10px}
.flap{display:inline-block;background:var(--blue);color:var(--cream);padding:6px 10px;font:10px ui-monospace,Menlo,monospace;letter-spacing:.14em;transform-origin:top center;transition:transform .35s cubic-bezier(.2,1.3,.3,1),background .2s}
.item.active .flap{background:var(--red);transform:rotateX(0deg)}
.flap.flipping{animation:flipDown .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes flipDown{0%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
.desc{margin-top:10px;font:10px/1.5 ui-monospace,Menlo,monospace;min-height:30px;max-width:28ch}
footer{margin-top:30px;border-top:3px solid var(--red);padding-top:10px;display:flex;justify-content:space-between;align-items:center;font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em}
footer button{background:var(--blue);color:var(--cream);border:0;padding:9px 14px;font:inherit;cursor:pointer}
footer button:hover{background:var(--red)}
@media(max-width:760px){.poster{grid-template-columns:repeat(2,1fr)}.disc{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}header{opacity:1}}
</style>
</head>
<body>
<header><h1>BAUHAUS BACKSTUBE<b>FORM FOLLOWS APPETITE</b></h1><div class="tag">SALE 058<br>SIX FORMS · SIX PRICES<br>WEIMAR, 1923</div></header>
<div class="poster" id="poster"><div class="disc" id="disc"></div></div>
<footer><span id="note">SELECT A FORM TO TURN ITS PRICE FLAP.</span><button id="clear" type="button">CLEAR SELECTION</button></footer>
<script>
const items=[
 ['BREZEL','12 PFENNIG','SALT, YEAST, A BROKEN EDGE.','pretzel'],
 ['SEEDCAKE','24 PFENNIG','POPPY, HONEY, THREE NIGHTS OLD.','cake'],
 ['RINGBUN','18 PFENNIG','CINNAMON, HONEY, ONE ALMOND.','ring'],
 ['STREUSEL','16 PFENNIG','BUTTER CRUMBS, PLUM, NO APOLOGY.','streusel'],
 ['WEDGE','09 PFENNIG','ALMOND PASTE, A SHARP CORNER.','triangle'],
 ['BISCUITS','14 PFENNIG','FOUR CIRCLES, SOLD ONLY TOGETHER.','biscuits']
];
const poster=document.getElementById('poster'),disc=document.getElementById('disc'),note=document.getElementById('note'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
items.forEach((it,i)=>{const b=document.createElement('button');b.type='button';b.className='item';b.style.setProperty('--i',i);b.setAttribute('aria-label',it[0]+' price');b.innerHTML=`<div class="shape"><div class="s ${it[3]}"></div></div><div class="no">NO. 0${i+1}</div><div class="name">${it[0]}</div><div class="flap">—</div><div class="desc"></div>`;b.addEventListener('click',()=>select(i,b));poster.appendChild(b)});
function select(i,b){const flap=b.querySelector('.flap');document.querySelectorAll('.item').forEach(x=>{x.classList.remove('active');x.querySelector('.flap').textContent='—';x.querySelector('.desc').textContent='';x.querySelector('.flap').classList.remove('flipping')});b.classList.add('active');flap.textContent=items[i][1];b.querySelector('.desc').textContent=items[i][2];if(!reduce){flap.classList.add('flipping');setTimeout(()=>flap.classList.remove('flipping'),500)}note.textContent='NO. 0'+(i+1)+' / '+items[i][0]+' / '+items[i][1];poster.classList.add('chosen');const r=b.getBoundingClientRect(),p=poster.getBoundingClientRect();disc.style.left=(r.left-p.left+r.width/2-75)+'px';disc.style.top=(r.top-p.top+50)+'px'}
document.getElementById('clear').addEventListener('click',()=>{document.querySelectorAll('.item').forEach(x=>{x.classList.remove('active');x.querySelector('.flap').textContent='—';x.querySelector('.desc').textContent=''});poster.classList.remove('chosen');note.textContent='SELECT A FORM TO TURN ITS PRICE FLAP.'});
poster.addEventListener('keydown',e=>{const bs=[...document.querySelectorAll('.item')],i=bs.indexOf(document.activeElement);let n=i;if(e.key==='ArrowRight')n=(i+1)%6;else if(e.key==='ArrowLeft')n=(i+5)%6;else if(e.key==='ArrowDown')n=(i+3)%6;else if(e.key==='ArrowUp')n=(i+3)%6;if(n!==i){bs[n].focus();e.preventDefault()}});
</script>
</body>
</html>
