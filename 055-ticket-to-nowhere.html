<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket to Nowhere — One Journey, Two Halves</title>
<style>
:root{--butter:#F0D77A;--red:#BA312A;--black:#201E1A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#DED9C4;color:var(--black);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{display:grid;place-items:center;min-height:100vh;padding:24px}
h1{position:absolute;left:24px;top:20px;font:10px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.22em;margin:0}
.serial{position:absolute;right:24px;top:20px;font:10px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--red)}
.ticket{position:relative;width:min(92vw,880px);height:300px;display:flex;filter:drop-shadow(10px 14px 0 rgba(32,30,26,.12));touch-action:none;user-select:none}
.half{position:relative;background:var(--butter);overflow:hidden;transition:transform .9s cubic-bezier(.16,1,.3,1)}
.half:after{content:'';position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(32,30,26,.025) 0 1px,transparent 1px 4px),radial-gradient(rgba(32,30,26,.06) 1px,transparent 1px);background-size:100% 4px,7px 7px}
.left{width:72%;clip-path:polygon(0 0,100% 0,calc(100% - var(--jag,0px)) 6%,100% 12%,calc(100% - var(--jag,0px)) 18%,100% 24%,calc(100% - var(--jag,0px)) 30%,100% 36%,calc(100% - var(--jag,0px)) 42%,100% 48%,calc(100% - var(--jag,0px)) 54%,100% 60%,calc(100% - var(--jag,0px)) 66%,100% 72%,calc(100% - var(--jag,0px)) 78%,100% 84%,calc(100% - var(--jag,0px)) 90%,100% 96%,100% 100%,0 100%)}
.right{width:28%;transform-origin:left center;border-left:2px dotted rgba(32,30,26,.5);clip-path:polygon(0 0,100% 0,100% 100%,0 100%,var(--jag2,0px) 96%,0 90%,var(--jag2,0px) 84%,0 78%,var(--jag2,0px) 72%,0 66%,var(--jag2,0px) 60%,0 54%,var(--jag2,0px) 48%,0 42%,var(--jag2,0px) 36%,0 30%,var(--jag2,0px) 24%,0 18%,var(--jag2,0px) 12%,0 6%)}
.torn .left{transform:translateX(-12px) rotate(-.4deg)}
.torn .right{transform:translate(92px,18px) rotate(2.4deg)}
.face{position:absolute;inset:0;padding:24px 28px;display:flex;flex-direction:column;justify-content:space-between;backface-visibility:hidden}
.over{font:10px ui-monospace,Menlo,monospace;letter-spacing:.3em}
.big{font:700 clamp(38px,6.4vw,76px)/.92 Georgia,serif;letter-spacing:-.04em}
.row{display:flex;justify-content:space-between;align-items:end;font:10px ui-monospace,Menlo,monospace;letter-spacing:.14em;border-top:2px solid var(--black);padding-top:9px}
.stamp{position:absolute;right:26px;top:84px;border:3px solid var(--red);color:var(--red);padding:7px 12px;font:700 15px ui-monospace,Menlo,monospace;letter-spacing:.14em;transform:rotate(-13deg) scale(2.2);opacity:0;pointer-events:none}
.printed .stamp{animation:stamp .35s cubic-bezier(.2,1.4,.3,1) .9s forwards}
@keyframes stamp{to{opacity:.82;transform:rotate(-13deg) scale(1)}}
.perf{position:absolute;left:72%;top:0;bottom:0;width:22px;margin-left:-11px;cursor:ew-resize;z-index:5}
.perf:before{content:'';position:absolute;left:10px;top:0;bottom:0;border-left:2px dotted rgba(32,30,26,.55)}
.tearhint{position:absolute;left:calc(72% - 78px);top:128px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.14em;transform:rotate(-90deg);white-space:nowrap;z-index:4;transition:opacity .3s}
.torn .tearhint{opacity:0}
.stub{position:relative;width:100%;height:100%;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.9,.2,1)}
.stub.flipped{transform:rotateY(180deg)}
.back{transform:rotateY(180deg);font:italic 14px/1.55 Georgia,serif;display:flex;align-items:center;padding:24px}
.stubno{font:9px ui-monospace,Menlo,monospace;letter-spacing:.14em}
.reset{position:absolute;left:24px;bottom:22px;background:transparent;border:1px solid var(--black);color:var(--black);padding:9px 12px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em;cursor:pointer}
.reset:hover{background:var(--black);color:var(--butter)}
@media(max-width:650px){h1,.serial{font-size:7px}.ticket{height:230px}.face{padding:16px}.big{font-size:36px}.stamp{font-size:10px;right:8px;top:70px}.tearhint{display:none}.reset{left:12px;bottom:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.printed .stamp{opacity:.82;transform:rotate(-13deg) scale(1)}}
</style>
</head>
<body>
<h1>TICKET TO NOWHERE / 55<br>NO RETURN · NO REFUND · NO MAP</h1><div class="serial" id="serialTop">ISSUE —</div>
<div class="ticket" id="ticket">
  <div class="half left"><div class="face"><div class="over">BRITISH &amp; IMAGINARY RAILWAY</div><div><div class="big">TO<br>NOWHERE</div><div class="stamp">CANCELLED</div></div><div class="row"><span>SINGLE</span><span>PLATFORM 0</span><span>NO RETURN</span></div></div></div>
  <div class="tearhint">TEAR HERE →</div>
  <div class="half right"><div class="stub" id="stub"><div class="face"><div class="over">STUB</div><div class="stubno" id="stubno">NX —</div><div class="over" style="font-size:7px">VALID UNTIL YOU STOP WONDERING</div></div><div class="face back">I took this instead of the train. I have never regretted the platform.</div></div></div>
  <div class="perf" id="perf"></div>
</div>
<button class="reset" id="reset" type="button">RESET TICKET</button>
<script>
const ticket=document.getElementById('ticket'),perf=document.getElementById('perf'),stub=document.getElementById('stub'),serialTop=document.getElementById('serialTop'),stubno=document.getElementById('stubno'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const serial='NX-'+Math.floor(10000+Math.random()*89999);serialTop.textContent='ISSUE '+serial;stubno.textContent=serial;
let dragging=false;
function tear(p){const j=Math.max(0,Math.min(1,p)),v=(j*9).toFixed(1)+'px';ticket.style.setProperty('--jag',v);ticket.style.setProperty('--jag2',v)}
function complete(){ticket.classList.add('torn');ticket.style.setProperty('--jag','9px');ticket.style.setProperty('--jag2','9px')}
perf.addEventListener('pointerdown',e=>{dragging=true;perf.setPointerCapture(e.pointerId);e.preventDefault()});
perf.addEventListener('pointermove',e=>{if(!dragging)return;const r=ticket.getBoundingClientRect();tear((e.clientX-r.left)/r.width-.62)});
perf.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;perf.releasePointerCapture(e.pointerId);complete()});
perf.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();complete()}});
perf.tabIndex=0;perf.setAttribute('role','button');perf.setAttribute('aria-label','Tear ticket');
stub.addEventListener('click',e=>{if(ticket.classList.contains('torn')){e.stopPropagation();stub.classList.toggle('flipped')}});
document.getElementById('reset').addEventListener('click',()=>{ticket.classList.remove('torn');stub.classList.remove('flipped');tear(0)});
setTimeout(()=>ticket.classList.add('printed'),50);
</script>
</body>
</html>
