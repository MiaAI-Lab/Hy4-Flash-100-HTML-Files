<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moth Lamp — A Small Study in Bad Decisions</title>
<style>
:root{--warm:#F1E4C8;--ink:#171512;--brown:#7B5A36}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--warm);font-family:Arial,Helvetica,sans-serif}
body{padding:24px 28px;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(241,228,200,.25);padding-bottom:12px}
h1{font:400 clamp(22px,3vw,34px)/1 Georgia,serif;margin:0}
.meta{font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#A88F67}
#field{position:relative;height:calc(100vh - 130px);min-height:420px;margin-top:4px;cursor:none}
canvas{width:100%;height:100%;display:block}
.hint{position:absolute;left:0;bottom:6px;font:italic 13px Georgia,serif;color:#9C8967;pointer-events:none}
.scatter{position:absolute;right:0;bottom:2px;background:none;border:1px solid #A88F67;color:var(--warm);padding:8px 14px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;cursor:pointer}
.scatter:hover{background:rgba(241,228,200,.1)}.scatter:focus-visible{outline:2px solid var(--warm);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>Moth Lamp</h1><span class="meta">OBSERVATION 067 · THIRTY SPECIMENS · ONE BAD IDEA</span></header>
<div id="field"><canvas id="canvas"></canvas><div class="hint">Move the lamp. Watch what they hide from each other.</div><button class="scatter" id="scatter" type="button">SCATTER</button></div>
<script>
const cv=document.getElementById('canvas'),ctx=cv.getContext('2d'),field=document.getElementById('field'),scatter=document.getElementById('scatter'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let w=0,h=0,moths=[],lamp={x:0,y:0,tx:0,ty:0};
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;w=r.width;h=r.height;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0);lamp.x=lamp.tx=w/2;lamp.y=lamp.ty=h/2;moths=Array.from({length:30},(_,i)=>{const a=i/30*6.283;return{x:w/2+Math.cos(a)*(160+Math.random()*260),y:h/2+Math.sin(a)*(120+Math.random()*220),vx:0,vy:0,phase:Math.random()*6.3,rate:.07+Math.random()*.05,orbit:55+Math.random()*130,dir:Math.random()<.5?-1:1,flash:0,size:5+Math.random()*3}})}
function drawMoth(m,t){const flap=Math.abs(Math.sin(t*m.rate+m.phase)),s=m.size,dx=m.vx,dy=m.vy,ang=Math.atan2(dy,dx);ctx.save();ctx.translate(m.x,m.y);ctx.rotate(ang);ctx.fillStyle=m.flash>0?'#D9A441':'#7B5A36';ctx.strokeStyle=m.flash>0?'#F1E4C8':'#A88F67';ctx.lineWidth=.7;[-1,1].forEach(side=>{ctx.save();ctx.scale(1,side);ctx.beginPath();ctx.ellipse(-1,-s*(.3+flap*.7),s*(.8+flap*.5),s*(.32+flap*.7),-.35,0,6.283);ctx.fill();ctx.stroke();if(m.flash>0){ctx.beginPath();ctx.arc(-1,-s*.75,s*.33,0,6.283);ctx.fillStyle='#F1E4C8';ctx.fill();ctx.fillStyle='#D9A441';ctx.beginPath();ctx.arc(-1,-s*.75,s*.16,0,6.283);ctx.fill()}ctx.restore()});ctx.fillStyle='#F1E4C8';ctx.fillRect(-s*.18,-s*.2,s*.36,s*.4);ctx.restore()}
function lampMark(){ctx.save();ctx.translate(lamp.x,lamp.y);ctx.strokeStyle='#F1E4C8';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,15,0,6.283);ctx.stroke();ctx.beginPath();ctx.moveTo(-24,0);ctx.lineTo(-19,0);ctx.moveTo(19,0);ctx.lineTo(24,0);ctx.moveTo(0,-24);ctx.lineTo(0,-19);ctx.moveTo(0,19);ctx.lineTo(0,24);ctx.stroke();ctx.fillStyle='#D9A441';ctx.beginPath();ctx.arc(0,0,2.5,0,6.283);ctx.fill();ctx.restore()}
function frame(t){ctx.clearRect(0,0,w,h);if(!reduce){lamp.x+=(lamp.tx-lamp.x)*.07;lamp.y+=(lamp.ty-lamp.y)*.07;moths.forEach(m=>{const dx=lamp.x-m.x,dy=lamp.y-m.y,d=Math.hypot(dx,dy)||1,pull=Math.min(.22,d/2400),tx=-dy/d*m.orbit*m.dir,ty=dx/d*m.orbit*m.dir;m.vx+=(dx/d*pull*22+tx*.018-m.vx*.035+Math.sin(t*.0013+m.phase)*.06);m.vy+=(dy/d*pull*22+ty*.018-m.vy*.035+Math.cos(t*.0011+m.phase)*.06);m.x+=m.vx;m.y+=m.vy;if(m.x<12||m.x>w-12)m.vx*=-.7;if(m.y<12||m.y>h-12)m.vy*=-.7;m.flash=Math.max(0,m.flash-.02)});for(let i=0;i<moths.length;i++)for(let j=i+1;j<moths.length;j++){const a=moths[i],b=moths[j];if(Math.hypot(a.x-b.x,a.y-b.y)<17){a.flash=b.flash=1;ctx.strokeStyle='rgba(217,164,65,.5)';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}}moths.forEach(m=>drawMoth(m,reduce?0:t));lampMark();requestAnimationFrame(frame)}
resize();requestAnimationFrame(frame);addEventListener('resize',resize);
field.addEventListener('pointermove',e=>{const r=field.getBoundingClientRect();lamp.tx=e.clientX-r.left;lamp.ty=e.clientY-r.top});
function scatterMoths(){moths.forEach(m=>{const a=Math.random()*6.283,s=9+Math.random()*8;m.vx+=Math.cos(a)*s;m.vy+=Math.sin(a)*s})}
field.addEventListener('click',scatterMoths);scatter.addEventListener('click',e=>{e.stopPropagation();scatterMoths()});
</script>
</body>
</html>
