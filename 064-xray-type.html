<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Ray Type — An Alphabet With Bones</title>
<style>
:root{--black:#0C1216;--white:#D8EDF2;--gray:#6F8994}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif}
body{padding:28px 32px}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--gray);padding-bottom:12px}
h1{font:400 clamp(22px,3vw,38px)/1 Georgia,serif;margin:0}
.meta{font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--gray)}
.layout{display:grid;grid-template-columns:1fr 340px;gap:38px;margin-top:26px}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:7px}
.letter{background:none;border:1px solid rgba(111,137,148,.25);padding:4px;cursor:pointer;animation:enter .6s cubic-bezier(.2,1.1,.3,1) both;animation-delay:calc(var(--i)*.025s)}
@keyframes enter{from{opacity:0;transform:translateY(12px)}}
.letter:hover,.letter:focus-visible{border-color:var(--white);outline:none;background:rgba(216,237,242,.04)}
.letter svg{width:100%;display:block}
.outline{fill:none;stroke:var(--gray);stroke-width:1.4;transition:stroke .3s}
.letter:hover .outline,.letter:focus .outline{stroke:var(--white)}
.xray{opacity:0;transition:opacity .35s}
.letter:hover .xray,.letter:focus .xray{opacity:1}
.bone{fill:none;stroke:var(--white);stroke-width:1.1}
.hatch{stroke:var(--gray);stroke-width:.55}
.viewer{border:1px solid var(--gray);padding:18px;position:relative;min-height:460px}
.viewer h2{font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--gray);margin:0 0 14px;font-weight:400}
.big{position:relative;height:300px;display:grid;place-items:center;overflow:hidden}
.big svg{height:100%;filter:drop-shadow(0 0 14px rgba(216,237,242,.2))}
.scan{position:absolute;left:0;right:0;height:2px;background:var(--white);box-shadow:0 0 18px var(--white);animation:scan 1.6s cubic-bezier(.4,0,.2,1) both;opacity:.7}
@keyframes scan{from{top:0}to{top:100%}}
.label{position:absolute;font:8px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--gray);white-space:nowrap}
.label:before{content:'';display:inline-block;width:18px;height:1px;background:var(--gray);vertical-align:middle;margin-right:6px}
.l1{top:36px;left:0}.l2{top:120px;right:0}.l3{bottom:74px;left:0}.l4{bottom:26px;right:0}
.caption{border-top:1px solid rgba(111,137,148,.4);padding-top:14px;font:12px/1.6 Georgia,serif;color:var(--gray)}
.caption b{color:var(--white);font-weight:400;font-style:italic}
@media(max-width:900px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(7,1fr)}.viewer{min-height:auto}.big{height:260px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.xray{opacity:1}.scan{display:none}}
</style>
</head>
<body>
<header><h1>X-Ray Type</h1><span class="meta">PLATE 064 · DEPARTMENT OF LETTER ANATOMY</span></header>
<div class="layout"><div class="grid" id="grid"></div><div class="viewer"><h2 id="title">SPECIMEN A</h2><div class="big" id="big"><svg id="bigSvg" viewBox="0 0 70 90"></svg><div class="scan" id="scan"></div><span class="label l1">SPINE</span><span class="label l2">RIBS</span><span class="label l3">MARROW</span><span class="label l4">PRESSURE</span></div><div class="caption" id="caption">Every letter carries the memory of the pressure used to make it. <b>A</b> holds that memory in a narrow triangular cage.</div></div></div>
<script>
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ',grid=document.getElementById('grid'),bigSvg=document.getElementById('bigSvg'),title=document.getElementById('title'),caption=document.getElementById('caption'),scan=document.getElementById('scan'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function bones(){return '<g class="xray"><rect x="0" y="0" width="70" height="90" fill="#6F8994" opacity=".18"/><path class="bone" d="M35 10 V80"/><path class="bone" d="M35 24 q-11 -9 -19 -2 M35 24 q11 -9 19 -2 M35 36 q-13 -9 -22 -1 M35 36 q13 -9 22 -1 M35 48 q-13 -8 -21 1 M35 48 q13 -8 21 1 M35 60 q-11 -6 -18 3 M35 60 q11 -6 18 3"/><g fill="#D8EDF2">'+[16,28,40,52,64,76].map(y=>'<rect x="32.5" y="'+y+'" width="5" height="6" rx="1"/>').join('')+'</g><path class="hatch" d="M4 74 L26 62 M10 82 L34 68 M44 68 L66 82 M38 62 L62 74 M2 30 L16 24 M54 24 L68 30"/></g>'}
function plate(ch,id){return '<defs><clipPath id="'+id+'"><text x="35" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="82">'+ch+'</text></clipPath></defs><g clip-path="url(#'+id+')">'+bones()+'</g><text class="outline" x="35" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="82">'+ch+'</text>'}
letters.split('').forEach((ch,i)=>{const b=document.createElement('button');b.type='button';b.className='letter';b.style.setProperty('--i',i);b.setAttribute('aria-label','Examine letter '+ch);b.innerHTML='<svg viewBox="0 0 70 90">'+plate(ch,'clip'+i)+'</svg>';b.addEventListener('click',()=>select(ch));b.addEventListener('mouseenter',()=>title.textContent='SPECIMEN '+ch);grid.appendChild(b)});
function select(ch){title.textContent='SPECIMEN '+ch;bigSvg.innerHTML='<defs><clipPath id="bigClip"><text x="35" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="82">'+ch+'</text></clipPath></defs><g clip-path="url(#bigClip)"><rect x="0" y="0" width="70" height="90" fill="#D8EDF2" opacity=".12"/>'+bones()+'</g><text class="outline" x="35" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="82" stroke="#D8EDF2">'+ch+'</text>';caption.textContent='Every letter carries the memory of the pressure used to make it. '+ch+' holds that memory in its own narrow architecture.';scan.style.animation='none';void scan.offsetWidth;if(!reduce)scan.style.animation='';}
select('A');
</script>
</body>
</html>
