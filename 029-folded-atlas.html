<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folded Atlas — The Same Country, Two Sides</title>
<style>
:root{--desk:#263E5C;--paper:#F4EFE4;--red:#C8482F;--ink:#263E5C;--chalk:#E9E2CB}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--paper);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:22px;overflow:hidden}
h1{position:absolute;top:22px;left:26px;font:10px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.24em;margin:0}
.foot{position:absolute;bottom:18px;left:26px;right:26px;text-align:center;font:italic 13px/1.4 Georgia,serif;color:#B8C4D2}
.scene{perspective:1800px;width:min(82vw,760px);aspect-ratio:1.42;position:relative;margin-top:26px}
.atlas{position:absolute;inset:0;transform-style:preserve-3d}
.half{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--paper);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lower{top:50%;border-top:1px dashed rgba(38,62,92,.35)}
.upper{top:0;transform-origin:50% 100%;transform-style:preserve-3d;will-change:transform;z-index:2}
.face{position:absolute;inset:0;backface-visibility:hidden}
.face svg{width:100%;height:100%;display:block}
.back{transform:rotateX(180deg);background:#1B3047}
.shadow{position:absolute;left:4%;right:4%;top:50%;height:2px;background:rgba(8,18,30,.55);filter:blur(6px);transform-origin:50% 0;pointer-events:none;z-index:1}
.tab{position:absolute;right:-34px;top:50%;width:34px;height:52px;background:var(--red);color:var(--paper);font:9px ui-monospace,Menlo,monospace;letter-spacing:.14em;display:grid;place-items:center;cursor:ns-resize;transform:translateY(-50%);z-index:5;touch-action:none}
.controls{display:flex;align-items:center;gap:14px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em;z-index:6}
input[type=range]{width:min(230px,34vw);accent-color:var(--red)}
button{background:transparent;color:var(--paper);border:1px solid var(--paper);padding:8px 12px;font:9px ui-monospace,Menlo,monospace;letter-spacing:.18em;cursor:pointer}
button:hover{background:var(--paper);color:var(--desk)}
.light{opacity:.1;transition:opacity .5s;transition-delay:var(--d)}
.night .light{opacity:1;filter:drop-shadow(0 0 5px var(--red))}
@media(max-width:650px){h1{font-size:8px}.foot{font-size:10px}.scene{width:92vw}.controls{gap:8px}}
@media(prefers-reduced-motion:reduce){.light{transition:none}}
</style>
</head>
<body>
<h1>FOLDED ATLAS / SHEET 29</h1>
<div class="scene">
  <div class="atlas" id="atlas">
    <div class="half lower">
      <div class="face"><svg viewBox="0 0 800 285" preserveAspectRatio="none"><g fill="none" stroke="#263E5C" stroke-width="1" opacity=".35"><path d="M-20 40 Q150 10 280 50 T820 36"/><path d="M-20 90 Q180 55 310 100 T820 80"/><path d="M-20 150 Q150 120 300 160 T820 135"/><path d="M-20 220 Q190 185 330 230 T820 200"/></g><path d="M410 -5 C430 50 380 80 420 120 C460 160 410 200 450 290" fill="none" stroke="#C8482F" stroke-width="4"/><text x="150" y="80" font-family="ui-monospace,monospace" font-size="13" fill="#263E5C" letter-spacing="2">LOW COUNTRY OF THE INNER POCKET</text><text x="520" y="200" font-family="ui-monospace,monospace" font-size="13" fill="#263E5C" letter-spacing="2">THE SECOND SHORE</text></svg></div>
      <div class="shadow" id="shadow"></div>
    </div>
    <div class="half upper" id="upper">
      <div class="face front"><svg viewBox="0 0 800 285" preserveAspectRatio="none"><g fill="none" stroke="#263E5C" stroke-width="1" opacity=".35"><path d="M-20 30 Q160 70 280 20 T820 60"/><path d="M-20 100 Q170 140 320 90 T820 120"/><path d="M-20 180 Q190 215 340 165 T820 190"/><path d="M-20 255 Q180 280 320 240 T820 260"/></g><path d="M380 285 C410 230 360 190 400 145 C440 100 395 50 420 -5" fill="none" stroke="#C8482F" stroke-width="4"/><text x="90" y="190" font-family="ui-monospace,monospace" font-size="13" fill="#263E5C" letter-spacing="2">BELLS WITHOUT CLOCKS</text><text x="500" y="70" font-family="ui-monospace,monospace" font-size="13" fill="#263E5C" letter-spacing="2">SALT MILES</text></svg></div>
      <div class="face back" id="back"><svg viewBox="0 0 800 285" preserveAspectRatio="none"><g fill="none" stroke="#E9E2CB" stroke-width="1" opacity=".4"><path d="M-20 30 Q160 70 280 20 T820 60"/><path d="M-20 100 Q170 140 320 90 T820 120"/><path d="M-20 180 Q190 215 340 165 T820 190"/><path d="M-20 255 Q180 280 320 240 T820 260"/></g><path d="M380 285 C410 230 360 190 400 145 C440 100 395 50 420 -5" fill="none" stroke="#E9E2CB" stroke-width="3" opacity=".8"/><g id="lights"></g><text x="90" y="225" font-family="ui-monospace,monospace" font-size="12" fill="#E9E2CB" letter-spacing="2">BELLS WITHOUT CLOCKS · 21:40</text></svg></div>
      <div class="tab" id="tab" role="slider" tabindex="0" aria-label="Fold angle" aria-valuemin="0" aria-valuemax="180" aria-valuenow="0">FOLD</div>
    </div>
  </div>
</div>
<div class="controls"><span>FLAT</span><input id="slider" type="range" min="0" max="180" step="1" value="0" aria-label="Fold the atlas"><span>FOLDED</span><button id="reset" type="button">RESET SHEET</button></div>
<div class="foot">A country fits in a pocket only when it is willing to become smaller.</div>
<script>
const NS='http://www.w3.org/2000/svg',upper=document.getElementById('upper'),slider=document.getElementById('slider'),shadow=document.getElementById('shadow'),back=document.getElementById('back'),tab=document.getElementById('tab'),lights=document.getElementById('lights');
const spots=[[230,90],[520,50],[400,140],[620,190],[150,215],[300,250]];
spots.forEach(([x,y],i)=>{const c=document.createElementNS(NS,'circle');c.setAttribute('class','light');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',4);c.setAttribute('fill','#C8482F');c.style.setProperty('--d',i*.11+'s');lights.appendChild(c)});
let angle=0,animating=false;
function set(v){angle=Math.max(0,Math.min(180,+v));upper.style.transform=`rotateX(${-angle}deg)`;shadow.style.opacity=Math.min(.8,angle/180*.8);shadow.style.transform=`scaleY(${1+angle/45})`;back.classList.toggle('night',angle>166);slider.value=Math.round(angle);tab.setAttribute('aria-valuenow',Math.round(angle))}
function entrance(){animating=true;const t0=performance.now(),from=180;function step(t){const p=Math.min(1,(t-t0)/1500),e=1-Math.pow(1-p,4);set(from*(1-e));if(p<1)requestAnimationFrame(step);else animating=false}requestAnimationFrame(step)}
slider.addEventListener('input',()=>{animating=false;set(slider.value)});
let dragging=false,startY=0,startA=0;
tab.addEventListener('pointerdown',e=>{dragging=true;animating=false;startY=e.clientY;startA=angle;tab.setPointerCapture(e.pointerId)});
tab.addEventListener('pointermove',e=>{if(dragging)set(startA+(e.clientY-startY)*.8)});
tab.addEventListener('pointerup',()=>dragging=false);tab.addEventListener('pointercancel',()=>dragging=false);
tab.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();animating=false;set(angle+(e.key==='ArrowDown'?12:-12))}});
document.getElementById('reset').addEventListener('click',()=>{animating=false;set(0)});
set(180);requestAnimationFrame(()=>requestAnimationFrame(entrance));
</script>
</body>
</html>
