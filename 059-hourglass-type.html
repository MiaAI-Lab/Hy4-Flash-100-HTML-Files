<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hourglass Type — Letterforms Full of Sand</title>
<style>
:root{--char:#1E1C19;--sand:#D7B878;--teal:#2E6A65}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--char);color:var(--sand);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
h1{position:absolute;left:24px;top:20px;font:10px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.22em;margin:0;z-index:2}
.stage{position:absolute;inset:0;display:grid;place-items:center;perspective:1200px}
#glass{position:relative;width:min(92vw,1100px);height:min(52vh,420px);transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.55,.02,.25,1);cursor:pointer;outline:none}
#glass.flipped{transform:rotateX(180deg)}
#glass:focus-visible{outline:2px solid var(--teal);outline-offset:10px}
canvas{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden}
.controls{position:absolute;left:24px;bottom:22px;right:24px;display:flex;justify-content:space-between;align-items:center;z-index:3;font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em}
button{background:transparent;border:1px solid var(--teal);color:var(--sand);padding:10px 16px;font:inherit;letter-spacing:.2em;cursor:pointer}
button:hover{background:var(--teal);color:var(--char)}
@media(max-width:600px){h1{font-size:7px}.controls{left:12px;right:12px;bottom:12px}}
@media(prefers-reduced-motion:reduce){#glass{transition:none}}
</style>
</head>
<body>
<h1>HOURGLASS TYPE / 59<br>FOUR LETTERS, ONE GRAVITY</h1>
<div class="stage"><div id="glass" tabindex="0" role="button" aria-label="Flip the hourglass word"><canvas id="c"></canvas></div></div>
<div class="controls"><span id="count">SAND REMAINING 74%</span><button id="flip" type="button">FLIP</button></div>
<script>
const glass=document.getElementById('glass'),c=document.getElementById('c'),ctx=c.getContext('2d'),count=document.getElementById('count'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mask=document.createElement('canvas'),mctx=mask.getContext('2d');
let W=0,H=0,parts=[],dir=1,flipping=false;
function resize(){const r=glass.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;c.width=W*d;c.height=H*d;mask.width=W*d;mask.height=H*d;ctx.setTransform(d,0,0,d,0,0);mctx.setTransform(d,0,0,d,0,0);buildMask();if(!parts.length)seed()}
function buildMask(){mctx.clearRect(0,0,W,H);mctx.fillStyle='#fff';mctx.font='900 '+Math.min(W*.27,H*.92)+'px Georgia,serif';mctx.textAlign='center';mctx.textBaseline='middle';mctx.fillText('HOUR',W/2,H/2)}
function seed(){const img=mctx.getImageData(0,0,mask.width,mask.height),d=img.data;parts=[];for(let i=0;i<1500;i++){let x,y,tries=0;do{x=Math.random()*W;y=Math.random()*H;tries++}while(tries<20&&d[(Math.floor(y*mask.height/H)*mask.width+Math.floor(x*mask.width/W))*4+3]<20);if(tries<20)parts.push({x,y,vx:(Math.random()-.5)*.06,vy:Math.random()*.4,wait:Math.random()*200})}}
function draw(){ctx.clearRect(0,0,W,H);mctx.getImageData;
 ctx.save();ctx.globalAlpha=.16;ctx.drawImage(mask,0,0,W,H);ctx.restore();
 for(const p of parts){
  if(!flipping){const mid=H/2;if(dir===1&&p.y>mid){p.y=mid-2;p.x=W*(.2+Math.random()*.6)}else if(dir===-1&&p.y<mid){p.y=mid+2;p.x=W*(.2+Math.random()*.6)}
   p.vy+=dir*.012;p.vy=Math.max(-2.2,Math.min(2.2,p.vy));p.x+=p.vx;p.y+=p.vy;
   if(p.x<0||p.x>W)p.vx*=-1}
  else{p.wait++;if(p.wait<45){p.x+=(Math.random()-.5)*.25;p.y+=(Math.random()-.5)*.25}}
  ctx.fillStyle='#D7B878';ctx.fillRect(p.x,p.y,1.6,1.6)
 }
 ctx.strokeStyle='rgba(46,106,101,.65)';ctx.lineWidth=1;ctx.strokeRect(W*.06,H*.1,W*.88,H*.8);
 const remaining=Math.round(parts.filter(p=>dir===1?p.y<H/2:p.y>H/2).length/parts.length*100);
 count.textContent='SAND REMAINING '+String(Math.max(0,Math.min(100,remaining))).padStart(2,'0')+'%';
 requestAnimationFrame(draw)}
function flip(){if(flipping)return;dir*=-1;flipping=true;glass.classList.toggle('flipped');parts.forEach(p=>p.wait=0);setTimeout(()=>{flipping=false;parts.forEach(p=>{p.vy=-dir*Math.random()*.4})},reduce?0:1500)}
glass.addEventListener('click',flip);glass.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}});
document.getElementById('flip').addEventListener('click',flip);
addEventListener('resize',resize);resize();requestAnimationFrame(draw);
</script>
</body>
</html>
