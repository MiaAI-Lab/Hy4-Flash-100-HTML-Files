<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Weather Is Being Typed — A Typewriter Forecast</title>
<style>
:root{--sky:#A7B3B9;--paper:#F4F1E8;--ink:#262B2E}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--sky);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{padding:24px 28px;background-image:repeating-linear-gradient(90deg,rgba(38,43,46,.025) 0 1px,transparent 1px 4px)}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(38,43,46,.5);padding-bottom:8px}
h1{font:400 clamp(20px,2.8vw,32px)/1 Georgia,serif;margin:0}
.meta{font:9px ui-monospace,Menlo,monospace;letter-spacing:.18em}
.sheet{position:relative;width:min(820px,92vw);height:calc(100vh - 190px);min-height:410px;margin:14px auto 0;background:var(--paper);padding:30px 42px;box-shadow:0 16px 40px rgba(38,43,46,.22);overflow:hidden}
.stamp{position:absolute;right:28px;top:22px;border:2px solid rgba(38,43,46,.35);transform:rotate(8deg);font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;padding:6px 10px;color:rgba(38,43,46,.6)}
#report{font:17px/2.05 ui-monospace,Menlo,monospace;letter-spacing:.03em;white-space:pre-wrap}
#report .ch{display:inline-block;transition:transform 1.05s cubic-bezier(.18,.85,.25,1),opacity 1.05s;transform-origin:center}
#report .ch.gusting{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:.15}
.cursor{display:inline-block;width:9px;height:19px;background:var(--ink);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
button{font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em;background:transparent;color:var(--ink);border:1px solid rgba(38,43,46,.55);padding:8px 12px;cursor:pointer;transition:background .2s,color .2s}
button:hover{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.gust{border-color:var(--ink);font-weight:bold}
input{font:12px ui-monospace,Menlo,monospace;letter-spacing:.12em;border:0;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink);padding:7px 4px;width:170px;outline:0}
input::placeholder{color:rgba(38,43,46,.45)}
.footer{position:absolute;left:42px;bottom:22px;right:42px;display:flex;justify-content:space-between;font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:rgba(38,43,46,.6)}
@media(max-width:600px){body{padding:12px}.sheet{padding:22px 20px;height:calc(100vh - 160px)}#report{font-size:13px;line-height:1.9}.stamp{display:none}.footer{left:20px;right:20px;font-size:7px}input{width:110px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1>The Weather Is Being Typed</h1><span class="meta">DISTRICT FORECAST OFFICE · FORM 082</span></header>
<div class="sheet">
  <div class="stamp">RECEIVED 06:14</div>
  <div id="report" aria-live="polite"></div>
  <div class="controls">
    <button type="button" data-word="DRIZZLE">DRIZZLE</button><button type="button" data-word="GALE">GALE</button><button type="button" data-word="HAIL">HAIL</button><button type="button" data-word="THAW">THAW</button><button type="button" data-word="MIST">MIST</button>
    <input id="word" type="text" maxlength="14" placeholder="TYPE A WORD" aria-label="Type a forecast word"><button type="button" class="gust" id="gust">GUST</button>
  </div>
  <div class="footer"><span>WORDS MAY BE ALTERED BY WIND</span><span id="count">000 LETTERS</span></div>
</div>
<script>
const report=document.getElementById('report'),count=document.getElementById('count'),input=document.getElementById('word'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let queue=[],typing=false,ac=null,mainCursor=null;
function cursor(){const c=document.createElement('span');c.className='cursor';return c}
function add(text){text=text.toUpperCase();if(reduce){const d=document.createElement('div');d.textContent=text;report.insertBefore(d,report.querySelector('.cursor'));count.textContent=String(report.textContent.replace(/\s/g,'').length).padStart(3,'0')+' LETTERS';return}queue.push(text);if(!typing)pump()}
function pump(){if(!queue.length){typing=false;return}typing=true;const text=queue.shift(),line=document.createElement('div');report.insertBefore(line,mainCursor);let i=0;const step=()=>{if(reduce){line.textContent=text;i=text.length}else{const ch=text[i++],s=document.createElement('span');s.className='ch';s.textContent=ch===' '?'\u00a0':ch;line.appendChild(s)}count.textContent=String(report.textContent.replace(/\s/g,'').length).padStart(3,'0')+' LETTERS';if(i<text.length)setTimeout(step,28+Math.random()*40);else setTimeout(pump,180)};step()}
function whoosh(){if(!ac)return;const t=ac.currentTime,buf=ac.createBuffer(1,ac.sampleRate*.9,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/d.length);const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();s.buffer=buf;f.type='bandpass';f.frequency.value=700;g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.0001,t+.9);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t)}
function gust(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();whoosh();if(reduce)return;const chars=[...report.querySelectorAll('.ch')];chars.forEach(ch=>{if(Math.random()>.45)return;ch.style.setProperty('--dx',(Math.random()*140-70)+'px');ch.style.setProperty('--dy',(Math.random()*50-25)+'px');ch.style.setProperty('--rot',(Math.random()*40-20)+'deg');ch.classList.add('gusting');setTimeout(()=>ch.classList.remove('gusting'),1100+Math.random()*500)})}
mainCursor=cursor();report.appendChild(mainCursor);
if(reduce){report.textContent='NORTH WIND RISING. VISIBILITY POOR.\nDRIZZLE EXPECTED BY NINE, THEN GALE.\nISSUED 06:14 · SIGNED THE DUTY TYPIST.';report.appendChild(mainCursor);count.textContent=String(report.textContent.replace(/\s/g,'').length).padStart(3,'0')+' LETTERS';typing=true}else{add('NORTH WIND RISING. VISIBILITY POOR.');add('DRIZZLE EXPECTED BY NINE, THEN GALE.')}
document.querySelectorAll('[data-word]').forEach(b=>b.addEventListener('click',()=>add('FURTHER: '+b.dataset.word+' AT THE COAST.')));
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&input.value.trim()){add('OBSERVED: '+input.value.trim()+'.');input.value=''}});
document.getElementById('gust').addEventListener('click',gust);
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='g'&&e.target!==input)gust()});
</script>
</body>
</html>
